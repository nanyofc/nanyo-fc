<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NANYO FOOTBALL CLUB</title>


<style>


/* =========================================
   RESET
========================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


html,
body{
  width:100%;
  background:#000;
  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


body{
  overflow-x:hidden;
}



/* =========================================
   HEADER
========================================= */

.header{

  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b5001d 52%,
      #980018 100%
    );

  position:relative;

  z-index:30;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.28);
}



.brand{

  display:flex;

  align-items:center;

  gap:13px;
}



.brand-logo{

  width:56px;
  height:56px;

  object-fit:contain;

  display:block;

  flex:0 0 56px;
}



.brand-name{

  color:#fff;

  font-size:31px;

  line-height:1;

  font-weight:900;

  letter-spacing:.055em;

  white-space:nowrap;

  text-shadow:
    0 2px 5px
    rgba(0,0,0,.22);
}



/* =========================================
   HAMBURGER
========================================= */

.menu{

  width:48px;
  height:48px;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:7px;
}



.menu span{

  width:30px;
  height:3px;

  display:block;

  border-radius:4px;

  background:#d9b44a;

  box-shadow:
    0 1px 2px
    rgba(0,0,0,.2);
}



/* =========================================
   MOVIE AREA
========================================= */

.movie-wrap{

  position:relative;

  width:100%;

  aspect-ratio:16 / 9;

  overflow:hidden;

  background:#000;

  isolation:isolate;
}



.movie{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  background:#000;

  opacity:0;

  transform:
    scale(1);

  filter:
    contrast(1.04)
    saturate(1.05);

  transition:
    opacity .32s ease;

}



.movie.active{

  opacity:1;
}



/* =========================================
   CINEMATIC SHADE
========================================= */

.movie-shade{

  position:absolute;

  inset:0;

  z-index:7;

  pointer-events:none;

  background:

    linear-gradient(
      to bottom,

      rgba(0,0,0,.10) 0%,
      transparent 35%,
      transparent 65%,
      rgba(0,0,0,.20) 100%
    );

}



/* =========================================
   SCAN LINES
========================================= */

.scanlines{

  position:absolute;

  inset:0;

  z-index:8;

  pointer-events:none;

  opacity:.12;

  background:

    repeating-linear-gradient(

      to bottom,

      rgba(255,255,255,.08) 0px,

      rgba(255,255,255,.08) 1px,

      transparent 1px,

      transparent 4px

    );

}



/* =========================================
   WHITE FLASH
========================================= */

.flash-white{

  position:absolute;

  inset:0;

  z-index:20;

  pointer-events:none;

  background:#fff;

  opacity:0;
}



.flash-white.fire{

  animation:
    whiteFlash .32s ease;
}



@keyframes whiteFlash{

  0%{
    opacity:0;
  }

  16%{
    opacity:.95;
  }

  35%{
    opacity:.22;
  }

  100%{
    opacity:0;
  }

}



/* =========================================
   RED FLASH
========================================= */

.flash-red{

  position:absolute;

  inset:0;

  z-index:19;

  pointer-events:none;

  background:#ef001b;

  opacity:0;

  mix-blend-mode:screen;
}



.flash-red.fire{

  animation:
    redFlash .42s ease;
}



@keyframes redFlash{

  0%{
    opacity:0;
  }

  18%{
    opacity:.55;
  }

  40%{
    opacity:.12;
  }

  100%{
    opacity:0;
  }

}



/* =========================================
   BLACKOUT
========================================= */

.blackout{

  position:absolute;

  inset:0;

  z-index:18;

  pointer-events:none;

  background:#000;

  opacity:0;
}



.blackout.fire{

  animation:
    blackoutFx .36s ease;
}



@keyframes blackoutFx{

  0%{
    opacity:0;
  }

  15%{
    opacity:.95;
  }

  36%{
    opacity:.95;
  }

  100%{
    opacity:0;
  }

}



/* =========================================
   RED SLASH
========================================= */

.red-slash{

  position:absolute;

  z-index:17;

  pointer-events:none;

  top:-60%;

  left:-120%;

  width:180%;
  height:220%;

  opacity:0;

  transform:
    rotate(-18deg);

  background:

    linear-gradient(

      90deg,

      transparent 0%,

      rgba(255,0,28,0) 28%,

      rgba(255,0,28,.92) 46%,

      #ff263d 50%,

      rgba(255,0,28,.86) 55%,

      transparent 72%

    );

}



.red-slash.fire{

  animation:
    slashFx .58s
    cubic-bezier(.12,.72,.2,1);
}



@keyframes slashFx{

  0%{

    left:-150%;

    opacity:0;

  }

  12%{

    opacity:1;

  }

  100%{

    left:110%;

    opacity:0;

  }

}



/* =========================================
   RGB LAYERS
========================================= */

.rgb-red,
.rgb-blue{

  position:absolute;

  inset:0;

  z-index:12;

  pointer-events:none;

  opacity:0;
}



.rgb-red{

  background:
    rgba(255,0,30,.22);

  mix-blend-mode:screen;
}



.rgb-blue{

  background:
    rgba(0,170,255,.20);

  mix-blend-mode:screen;
}



.movie-wrap.rgb .rgb-red{

  animation:
    rgbRed .32s steps(2);
}



.movie-wrap.rgb .rgb-blue{

  animation:
    rgbBlue .32s steps(2);
}



@keyframes rgbRed{

  0%{
    opacity:0;
    transform:translateX(0);
  }

  25%{
    opacity:.8;
    transform:translateX(-8px);
  }

  55%{
    opacity:.35;
    transform:translateX(5px);
  }

  100%{
    opacity:0;
    transform:translateX(0);
  }

}



@keyframes rgbBlue{

  0%{
    opacity:0;
    transform:translateX(0);
  }

  25%{
    opacity:.8;
    transform:translateX(8px);
  }

  55%{
    opacity:.35;
    transform:translateX(-5px);
  }

  100%{
    opacity:0;
    transform:translateX(0);
  }

}



/* =========================================
   VIDEO PUNCH
========================================= */

.movie-wrap.punch
.movie.active{

  animation:
    punchZoom .72s
    cubic-bezier(.16,.8,.2,1);
}



@keyframes punchZoom{

  0%{

    transform:
      scale(1.16);

    filter:
      contrast(1.45)
      saturate(1.45)
      brightness(1.15);

  }


  40%{

    transform:
      scale(1.06);

  }


  100%{

    transform:
      scale(1);

    filter:
      contrast(1.04)
      saturate(1.05)
      brightness(1);

  }

}



/* =========================================
   SCREEN SHAKE
========================================= */

.movie-wrap.shake{

  animation:
    screenShake .34s
    linear;
}



@keyframes screenShake{

  0%{
    transform:translate(0,0);
  }

  15%{
    transform:translate(-5px,2px);
  }

  30%{
    transform:translate(6px,-2px);
  }

  45%{
    transform:translate(-4px,-1px);
  }

  60%{
    transform:translate(5px,2px);
  }

  75%{
    transform:translate(-2px,0);
  }

  100%{
    transform:translate(0,0);
  }

}



/* =========================================
   TEXT AREA
========================================= */

.hero-copy{

  position:relative;

  width:100%;

  overflow:hidden;

  padding:

    31px
    0
    46px
    22px;


  background:

    radial-gradient(
      circle at 100% 0%,
      rgba(135,0,16,.18),
      transparent 43%
    ),

    #000;
}



/* =========================================
   MAIN TITLE
========================================= */

.main-title{

  position:relative;

  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;

  transform-origin:left center;
}



.main-title.play{

  animation:
    titleSlam
    .72s
    cubic-bezier(.08,.82,.22,1);
}



@keyframes titleSlam{

  0%{

    opacity:0;

    transform:
      translateX(-45px)
      skewX(-13deg)
      scale(1.17);

    filter:
      blur(10px);

  }


  42%{

    opacity:1;

    transform:
      translateX(8px)
      skewX(3deg)
      scale(1.03);

    filter:
      blur(1px);

  }


  62%{

    transform:
      translateX(-4px)
      skewX(-2deg);

  }


  100%{

    opacity:1;

    transform:
      translateX(0)
      skewX(0)
      scale(1);

    filter:
      blur(0);

  }

}



/* =========================================
   COUNTERATTACK
========================================= */

.catch{

  position:relative;

  display:inline-block;

  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;

  font-style:italic;

  letter-spacing:.012em;

  white-space:nowrap;

}



.catch.play{

  animation:
    catchGlitch .76s
    steps(1);
}



@keyframes catchGlitch{

  0%{

    opacity:0;

    transform:
      translateX(-40px);

    text-shadow:none;

  }


  14%{

    opacity:1;

    transform:
      translateX(7px);

    text-shadow:
      -7px 0 #00eaff,
      7px 0 #ff0033;

  }


  28%{

    transform:
      translateX(-5px);

    text-shadow:
      5px 0 #00eaff,
      -5px 0 #ff0033;

  }


  40%{

    transform:
      translateX(4px);

    text-shadow:
      -3px 0 #00eaff,
      3px 0 #ff0033;

  }


  52%{

    transform:
      translateX(-2px);

    text-shadow:none;

  }


  68%{

    transform:
      translateX(2px);

    text-shadow:
      2px 0 #00eaff,
      -2px 0 #ff0033;

  }


  100%{

    opacity:1;

    transform:
      translateX(0);

    text-shadow:none;

  }

}



/* =========================================
   RED LINE
========================================= */

.red-line{

  position:relative;

  width:
    calc(100vw - 22px);

  height:4px;

  margin-top:20px;

  transform-origin:left center;

  background:

    linear-gradient(

      90deg,

      #ef001c 0%,

      #ff263c 50%,

      #ff001f 78%,

      transparent 100%

    );

}



.red-line.play{

  animation:
    redBeam .7s
    cubic-bezier(.1,.76,.18,1);
}



@keyframes redBeam{

  0%{

    transform:
      scaleX(0);

    filter:
      brightness(3);

  }


  55%{

    transform:
      scaleX(1.06);

    filter:
      brightness(2);

  }


  100%{

    transform:
      scaleX(1);

    filter:
      brightness(1);

  }

}



/* 光の先端 */

.red-line::after{

  content:"";

  position:absolute;

  right:0;
  top:50%;

  width:22px;
  height:10px;

  transform:
    translateY(-50%);

  background:
    radial-gradient(
      circle,
      #fff 0%,
      #ff263c 28%,
      transparent 72%
    );

  opacity:.8;
}



/* =========================================
   PC
========================================= */

@media(min-width:768px){


  .header{

    height:98px;

    padding:
      0 42px;

  }


  .brand-logo{

    width:70px;
    height:70px;

    flex-basis:70px;

  }


  .brand-name{

    font-size:40px;

  }


  .menu span{

    width:36px;
    height:4px;

  }


  .hero-copy{

    padding:

      48px
      0
      65px
      6vw;

  }


  .main-title{

    font-size:
      clamp(
        68px,
        7vw,
        110px
      );

  }


  .catch{

    font-size:
      clamp(
        28px,
        3vw,
        48px
      );

  }


  .red-line{

    width:
      calc(100vw - 6vw);

  }

}


</style>

</head>



<body>



<!-- =========================================
     HEADER
========================================== -->

<header class="header">


  <div class="brand">


    <img

      src="nf1.png"

      alt="NANYO FC"

      class="brand-logo"

    >


    <div class="brand-name">

      NANYO FC

    </div>


  </div>



  <div class="menu">

    <span></span>
    <span></span>
    <span></span>

  </div>


</header>




<!-- =========================================
     MOVIE
========================================== -->

<section
  id="movieWrap"
  class="movie-wrap"
>


  <video

    id="movieA"

    class="movie active"

    muted

    playsinline

    preload="auto">

  </video>



  <video

    id="movieB"

    class="movie"

    muted

    playsinline

    preload="metadata">

  </video>



  <div class="movie-shade"></div>

  <div class="scanlines"></div>

  <div class="rgb-red"></div>

  <div class="rgb-blue"></div>

  <div
    id="blackout"
    class="blackout">
  </div>

  <div
    id="flashRed"
    class="flash-red">
  </div>

  <div
    id="flashWhite"
    class="flash-white">
  </div>

  <div
    id="redSlash"
    class="red-slash">
  </div>


</section>




<!-- =========================================
     COPY
========================================== -->

<section class="hero-copy">


  <h1

    id="mainTitle"

    class="main-title">

    NANYO<br>

    FOOTBALL CLUB

  </h1>



  <div

    id="catchText"

    class="catch">

    COUNTERATTACK BEGINS

  </div>



  <div

    id="redLine"

    class="red-line">

  </div>


</section>




<script>


/* =========================================
   MOVIES
========================================= */

const movies = [

  "movie/nf1.mp4",

  "movie/nf2.mp4",

  "movie/nf3.mp4",

  "movie/nf4.mp4",

  "movie/nf5.mp4",

  "movie/nf6.mp4"

];



const movieA =
  document.getElementById("movieA");


const movieB =
  document.getElementById("movieB");


const movieWrap =
  document.getElementById("movieWrap");


const flashWhite =
  document.getElementById("flashWhite");


const flashRed =
  document.getElementById("flashRed");


const blackout =
  document.getElementById("blackout");


const redSlash =
  document.getElementById("redSlash");


const mainTitle =
  document.getElementById("mainTitle");


const catchText =
  document.getElementById("catchText");


const redLine =
  document.getElementById("redLine");



let activeMovie =
  movieA;


let standbyMovie =
  movieB;


let playlist = [];


let lastMovie =
  null;


let switching =
  false;



/* =========================================
   SHUFFLE
========================================= */

function shuffleMovies(){


  playlist =
    [...movies];


  for(

    let i =
      playlist.length - 1;

    i > 0;

    i--

  ){


    const j =

      Math.floor(

        Math.random()
        *
        (i + 1)

      );


    [

      playlist[i],
      playlist[j]

    ] = [

      playlist[j],
      playlist[i]

    ];

  }



  if(

    lastMovie &&

    playlist.length > 1 &&

    playlist[0] === lastMovie

  ){


    [

      playlist[0],
      playlist[1]

    ] = [

      playlist[1],
      playlist[0]

    ];

  }

}




function getNextMovie(){


  if(
    playlist.length === 0
  ){

    shuffleMovies();

  }


  const next =
    playlist.shift();


  lastMovie =
    next;


  return next;

}



/* =========================================
   PRELOAD
========================================= */

function prepareNextMovie(){


  standbyMovie.src =
    getNextMovie();


  standbyMovie.load();

}



/* =========================================
   ANIMATION RESET
========================================= */

function restartClass(
  element,
  className
){


  element
    .classList
    .remove(className);


  void element.offsetWidth;


  element
    .classList
    .add(className);

}



/* =========================================
   TEXT FX
========================================= */

function replayText(){


  restartClass(
    mainTitle,
    "play"
  );


  setTimeout(

    () => {

      restartClass(
        catchText,
        "play"
      );

    },

    100

  );


  setTimeout(

    () => {

      restartClass(
        redLine,
        "play"
      );

    },

    230

  );

}



/* =========================================
   RANDOM PV EFFECT
========================================= */

function runMovieFx(){


  movieWrap.classList.remove(

    "rgb",
    "punch",
    "shake"

  );


  const type =
    Math.floor(
      Math.random() * 3
    );



  /*
     TYPE 0
     BLACK → FLASH → PUNCH
  */

  if(type === 0){


    restartClass(
      blackout,
      "fire"
    );


    setTimeout(
      () => {

        restartClass(
          flashWhite,
          "fire"
        );

      },
      80
    );


    setTimeout(
      () => {

        movieWrap
          .classList
          .add(
            "punch"
          );

      },
      130
    );

  }



  /*
     TYPE 1
     RED SLASH → SHAKE
  */

  if(type === 1){


    restartClass(
      redSlash,
      "fire"
    );


    restartClass(
      flashRed,
      "fire"
    );


    setTimeout(
      () => {

        movieWrap
          .classList
          .add(
            "shake"
          );

      },
      90
    );

  }



  /*
     TYPE 2
     RGB → FLASH → SHAKE
  */

  if(type === 2){


    movieWrap
      .classList
      .add(
        "rgb"
      );


    restartClass(
      flashWhite,
      "fire"
    );


    setTimeout(
      () => {

        movieWrap
          .classList
          .add(
            "shake"
          );

      },
      70
    );


    setTimeout(
      () => {

        movieWrap
          .classList
          .add(
            "punch"
          );

      },
      110
    );

  }



  /*
     FXクラス解除
  */

  setTimeout(

    () => {

      movieWrap.classList.remove(

        "rgb",
        "punch",
        "shake"

      );

    },

    850

  );

}



/* =========================================
   SWITCH
========================================= */

function switchMovie(){


  if(switching){
    return;
  }


  switching =
    true;



  /*
     先にPVエフェクト
  */

  runMovieFx();



  setTimeout(

    () => {


      standbyMovie.currentTime =
        0;



      standbyMovie
        .play()


        .then(

          () => {


            standbyMovie
              .classList
              .add(
                "active"
              );


            activeMovie
              .classList
              .remove(
                "active"
              );



            /*
              TEXT PV
            */

            replayText();



            setTimeout(

              () => {


                activeMovie.pause();



                const old =
                  activeMovie;



                activeMovie =
                  standbyMovie;



                standbyMovie =
                  old;



                prepareNextMovie();



                switching =
                  false;


              },

              480

            );

          }

        )


        .catch(

          () => {

            switching =
              false;

          }

        );


    },

    130

  );

}



/* =========================================
   START
========================================= */

function startMovies(){


  shuffleMovies();



  activeMovie.src =
    getNextMovie();


  activeMovie.load();



  activeMovie
    .play()
    .catch(
      () => {}
    );



  prepareNextMovie();



  /*
     開いた瞬間もPV
  */

  setTimeout(

    () => {

      runMovieFx();

      replayText();

    },

    250

  );

}



/* =========================================
   EVENTS
========================================= */

movieA.addEventListener(

  "ended",

  switchMovie

);


movieB.addEventListener(

  "ended",

  switchMovie

);



startMovies();


</script>


</body>

</html>
