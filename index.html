<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NANYO FOOTBALL CLUB</title>


<style>

/* ======================================
   RESET
====================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  background:#000;
  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  overflow-x:hidden;
}



/* ======================================
   HEADER
====================================== */

.header{

  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b6001d 55%,
      #980018 100%
    );

  position:relative;

  z-index:20;
}


.brand{

  display:flex;
  align-items:center;

  gap:13px;
}


.brand-logo{

  width:56px;
  height:56px;

  display:block;

  object-fit:contain;
}


.brand-name{

  color:#fff;

  font-size:31px;

  line-height:1;

  font-weight:900;

  letter-spacing:.055em;

  white-space:nowrap;
}


.menu{

  width:48px;
  height:48px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:7px;
}


.menu span{

  width:30px;
  height:3px;

  display:block;

  border-radius:3px;

  background:#d7b24a;
}



/* ======================================
   MOVIE
====================================== */

.movie-wrap{

  position:relative;

  width:100%;

  aspect-ratio:16 / 9;

  overflow:hidden;

  background:#000;
}


#heroVideo{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  display:block;

  background:#000;

  transform:scale(1.01);

  will-change:transform;
}


/*
   動画開始時に
   ゆっくりほんの少しズーム
*/

#heroVideo.motion{

  animation:
    movieMotion
    var(--video-duration, 8s)
    linear
    forwards;
}


@keyframes movieMotion{

  from{
    transform:scale(1.01);
  }

  to{
    transform:scale(1.045);
  }

}



/* ======================================
   MOVIE SHADE
====================================== */

.movie-shade{

  position:absolute;

  inset:0;

  z-index:2;

  pointer-events:none;


  background:

    linear-gradient(
      to bottom,

      rgba(0,0,0,.02) 0%,

      transparent 50%,

      rgba(0,0,0,.07) 100%
    );
}



/* ======================================
   SVG OVERLAY
====================================== */

.mark-layer{

  position:absolute;

  inset:0;

  z-index:3;

  pointer-events:none;

  overflow:hidden;
}


.mark-svg{

  width:100%;
  height:100%;

  display:block;
}



/*
   ロゴ本体

   動画を邪魔しないよう
   かなり薄め
*/

.logo-shape{

  fill:#e0002c;

  fill-opacity:.085;
}



/*
   8秒かけて
   左から徐々に完成
*/

.reveal-box{

  transform-origin:left center;

  transform:scaleX(0);
}


.mark-layer.play
.reveal-box{

  animation:
    revealMark
    8s
    cubic-bezier(.22,.70,.18,1)
    forwards;
}


@keyframes revealMark{

  0%{
    transform:scaleX(0);
  }

  100%{
    transform:scaleX(1);
  }

}



/*
   描画の先端だけ
   ごく薄く光る
*/

.draw-head{

  position:absolute;

  top:0;
  left:-8%;

  width:9%;
  height:100%;

  opacity:0;

  pointer-events:none;


  background:

    linear-gradient(
      90deg,

      transparent,

      rgba(255,40,60,.10),

      rgba(255,255,255,.13),

      transparent
    );
}


.mark-layer.play
.draw-head{

  animation:
    drawHeadMove
    8s
    linear
    forwards;
}


@keyframes drawHeadMove{

  0%{

    left:-9%;

    opacity:0;
  }

  5%{

    opacity:1;
  }

  95%{

    opacity:1;
  }

  100%{

    left:100%;

    opacity:0;
  }

}



/* ======================================
   TEXT AREA
====================================== */

.hero-copy{

  width:100%;

  overflow:hidden;

  padding:

    31px
    0
    46px
    22px;


  background:

    radial-gradient(
      circle at 100% 0%,

      rgba(140,0,15,.18),

      transparent 43%
    ),

    #000;
}



/* ======================================
   TITLE
====================================== */

.main-title{

  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;
}


.main-title.play{

  animation:
    titleIn
    .65s
    cubic-bezier(.12,.8,.2,1);
}


@keyframes titleIn{

  from{

    opacity:0;

    transform:
      translateX(-28px);

    filter:
      blur(4px);
  }

  to{

    opacity:1;

    transform:
      translateX(0);

    filter:
      blur(0);
  }

}



/* ======================================
   COUNTERATTACK
====================================== */

.catch{

  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;
  font-style:italic;

  letter-spacing:.012em;

  white-space:nowrap;
}


.catch.play{

  animation:
    catchIn
    .55s
    ease;
}


@keyframes catchIn{

  from{

    opacity:0;

    transform:
      translateX(-18px);
  }

  to{

    opacity:1;

    transform:
      translateX(0);
  }

}



/* ======================================
   RED LINE
====================================== */

.red-line{

  width:
    calc(100vw - 22px);

  height:4px;

  margin-top:20px;

  transform-origin:left center;


  background:

    linear-gradient(
      90deg,

      #ed001d 0%,

      #ff1931 65%,

      transparent 100%
    );
}


.red-line.play{

  animation:
    redLineIn
    .75s
    cubic-bezier(.1,.8,.18,1);
}


@keyframes redLineIn{

  from{

    transform:
      scaleX(0);
  }

  to{

    transform:
      scaleX(1);
  }

}



/* ======================================
   PC
====================================== */

@media(min-width:768px){

  .header{

    height:98px;

    padding:
      0 42px;
  }


  .brand-logo{

    width:70px;
    height:70px;
  }


  .brand-name{

    font-size:40px;
  }


  .menu span{

    width:36px;
    height:4px;
  }


  .hero-copy{

    padding:

      48px
      0
      65px
      6vw;
  }

}

</style>

</head>

<!-- ======================================
     COPY
====================================== -->

<section class="hero-copy">


  <h1
    id="mainTitle"
    class="main-title"
  >

    NANYO<br>

    FOOTBALL CLUB

  </h1>



  <div
    id="catchText"
    class="catch"
  >

    COUNTERATTACK BEGINS

  </div>



  <div
    id="redLine"
    class="red-line"
  ></div>


</section>




<script>


/* ======================================
   MOVIE LIST
====================================== */

const movies = [

  "movie/nf1.mp4",

  "movie/nf2.mp4",

  "movie/nf3.mp4",

  "movie/nf4.mp4",

  "movie/nf5.mp4",

  "movie/nf6.mp4"

];



const video =
  document.getElementById(
    "heroVideo"
  );


const markLayer =
  document.getElementById(
    "markLayer"
  );


const mainTitle =
  document.getElementById(
    "mainTitle"
  );


const catchText =
  document.getElementById(
    "catchText"
  );


const redLine =
  document.getElementById(
    "redLine"
  );



let playlist = [];

let previousMovie = null;

let loading = false;



/* ======================================
   SHUFFLE
====================================== */

function shuffleMovies(){


  playlist =
    [...movies];


  for(

    let i =
      playlist.length - 1;

    i > 0;

    i--

  ){


    const j =

      Math.floor(

        Math.random()
        *
        (i + 1)

      );


    [

      playlist[i],
      playlist[j]

    ] = [

      playlist[j],
      playlist[i]

    ];

  }



  /*
     一巡後、

     前回最後の動画と
     次回最初が同じになるのを防ぐ
  */

  if(

    previousMovie &&

    playlist.length > 1 &&

    playlist[0] ===
    previousMovie

  ){


    [

      playlist[0],
      playlist[1]

    ] = [

      playlist[1],
      playlist[0]

    ];

  }

}



/* ======================================
   GET NEXT
====================================== */

function getNextMovie(){


  if(
    playlist.length === 0
  ){

    shuffleMovies();

  }


  const next =
    playlist.shift();


  previousMovie =
    next;


  return next;

}



/* ======================================
   RESTART CLASS
====================================== */

function restartClass(
  element,
  className
){


  element
    .classList
    .remove(className);


  void element.offsetWidth;


  element
    .classList
    .add(className);

}



/* ======================================
   SVG START
====================================== */

function startSvgAnimation(){


  markLayer
    .classList
    .remove("play");


  void markLayer.offsetWidth;


  markLayer
    .classList
    .add("play");

}



/* ======================================
   TEXT
====================================== */

function startTextAnimation(){


  restartClass(
    mainTitle,
    "play"
  );


  setTimeout(
    () => {

      restartClass(
        catchText,
        "play"
      );

    },
    100
  );


  setTimeout(
    () => {

      restartClass(
        redLine,
        "play"
      );

    },
    220
  );

}



/* ======================================
   VIDEO MOTION
====================================== */

function startVideoMotion(){


  video
    .classList
    .remove("motion");


  void video.offsetWidth;


  video
    .classList
    .add("motion");

}



/* ======================================
   PLAY
====================================== */

function playNextMovie(){


  if(loading){
    return;
  }


  loading = true;


  const next =
    getNextMovie();


  video.src =
    next;


  video.load();



  /*
     SVGは動画読み込みとは
     完全に分離。

     動画読込失敗で
     SVGまで止まらない。
  */

  startSvgAnimation();



  /*
     下文字も毎回再演出
  */

  startTextAnimation();



  const playPromise =
    video.play();


  if(
    playPromise !== undefined
  ){


    playPromise

      .then(
        () => {

          loading = false;

        }
      )

      .catch(
        () => {

          loading = false;

        }
      );

}



/* ======================================
   METADATA
====================================== */

video.addEventListener(

  "loadedmetadata",

  () => {


    const duration =

      Number.isFinite(
        video.duration
      )

      ?

      video.duration

      :

      8;



    video.style
      .setProperty(

        "--video-duration",

        duration + "s"

      );


    startVideoMotion();


  }

);



/* ======================================
   VIDEO END
====================================== */

video.addEventListener(

  "ended",

  () => {


    playNextMovie();


  }

);



/* ======================================
   ERROR
====================================== */

video.addEventListener(

  "error",

  () => {


    /*
       万一1本だけ
       読み込みに失敗しても
       次へ進む
    */


    loading = false;


    setTimeout(
      playNextMovie,
      300
    );


  }

);



/* ======================================
   スマホ復帰時
====================================== */

document.addEventListener(

  "visibilitychange",

  () => {


    if(
      !document.hidden &&
      video.paused &&
      !video.ended
    ){


      video
        .play()
        .catch(
          () => {}
        );


    }

  }

);



/* ======================================
   START
====================================== */

shuffleMovies();

playNextMovie();


</script>
