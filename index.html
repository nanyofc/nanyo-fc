<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NANYO FOOTBALL CLUB</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

.header{
  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b6001d 55%,
      #980018 100%
    );
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{
  width:56px;
  height:56px;
  object-fit:contain;
  display:block;
}

.brand-name{
  color:#fff;

  font-size:31px;
  line-height:1;

  font-weight:900;
  letter-spacing:.055em;

  white-space:nowrap;
}

.menu{
  width:48px;
  height:48px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  gap:7px;
}

.menu span{
  display:block;

  width:30px;
  height:3px;

  border-radius:3px;

  background:#d7b24a;
}


/* =========================
   MOVIE
========================= */

.movie-wrap{
  position:relative;

  width:100%;
  aspect-ratio:16 / 9;

  overflow:hidden;

  background:#000;
}

#heroVideo{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
  object-position:center;

  background:#000;
}


/* =========================
   COPY
========================= */

.hero-copy{
  width:100%;

  padding:
    31px
    0
    46px
    22px;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(140,0,15,.18),
      transparent 43%
    ),
    #000;
}

.main-title{
  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;
}

.catch{
  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;
  font-style:italic;

  white-space:nowrap;
}

.red-line{
  width:
    calc(100vw - 22px);

  height:4px;

  margin-top:20px;

  background:
    linear-gradient(
      90deg,
      #ed001d 0%,
      #ff1931 65%,
      transparent 100%
    );
}


/* =========================
   PC
========================= */

@media(min-width:768px){

  .header{
    height:98px;
    padding:0 42px;
  }

  .brand-logo{
    width:70px;
    height:70px;
  }

  .brand-name{
    font-size:40px;
  }

  .menu span{
    width:36px;
    height:4px;
  }

  .hero-copy{
    padding:
      48px
      0
      65px
      6vw;
  }

}

</style>
</head>


<body>


<header class="header">

  <div class="brand">

    <img
      src="nf1.png"
      alt="NANYO FC"
      class="brand-logo"
    >

    <div class="brand-name">
      NANYO FC
    </div>

  </div>


  <div class="menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

</header>



<section class="movie-wrap">

  <video
    id="heroVideo"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

</section>



<section class="hero-copy">

  <h1 class="main-title">
    NANYO<br>
    FOOTBALL CLUB
  </h1>

  <div class="catch">
    COUNTERATTACK BEGINS
  </div>

  <div class="red-line"></div>

</section>



<script>

const movies = [
  "movie/nf1.mp4",
  "movie/nf2.mp4",
  "movie/nf3.mp4",
  "movie/nf4.mp4",
  "movie/nf5.mp4",
  "movie/nf6.mp4"
];

const video =
  document.getElementById("heroVideo");


let playlist = [];
let lastMovie = null;


/* =========================
   シャッフル
========================= */

function shuffleMovies(){

  playlist = [...movies];

  for(
    let i = playlist.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      playlist[i],
      playlist[j]
    ] = [
      playlist[j],
      playlist[i]
    ];

  }


  /* 一巡の境目で同じ動画を防ぐ */

  if(
    lastMovie &&
    playlist.length > 1 &&
    playlist[0] === lastMovie
  ){

    [
      playlist[0],
      playlist[1]
    ] = [
      playlist[1],
      playlist[0]
    ];

  }

}


/* =========================
   次の動画
========================= */

function getNextMovie(){

  if(playlist.length === 0){
    shuffleMovies();
  }

  const next =
    playlist.shift();

  lastMovie =
    next;

  return next;

}


/* =========================
   動画読込
========================= */

function loadNextMovie(){

  const next =
    getNextMovie();

  video.pause();

  video.src =
    next;

  video.load();

}


/* =========================
   再生可能になってから再生
========================= */

video.addEventListener(
  "canplay",

  () => {

    video
      .play()
      .catch(() => {});

  }
);


/* =========================
   終わったらランダム次動画
========================= */

video.addEventListener(
  "ended",

  () => {

    loadNextMovie();

  }
);


/* =========================
   1本壊れていても次へ
========================= */

video.addEventListener(
  "error",

  () => {

    setTimeout(
      loadNextMovie,
      300
    );

  }
);


/* =========================
   START
========================= */

shuffleMovies();

loadNextMovie();

</script>


</body>
</html>
