<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NANYO FOOTBALL CLUB</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}


/* ==================================================
   HEADER
================================================== */

.header{
  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b6001d 55%,
      #970018 100%
    );

  position:relative;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{
  width:56px;
  height:56px;

  display:block;
  object-fit:contain;
}

.brand-name{
  color:#fff;

  font-size:31px;
  line-height:1;

  font-weight:900;
  letter-spacing:.055em;

  white-space:nowrap;
}

.menu{
  width:48px;
  height:48px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  gap:7px;
}

.menu span{
  display:block;

  width:30px;
  height:3px;

  border-radius:3px;

  background:#d7b24a;
}


/* ==================================================
   MOVIE AREA
================================================== */

.movie-wrap{
  position:relative;

  width:100%;
  aspect-ratio:16 / 9;

  overflow:hidden;
  background:#000;

  isolation:isolate;
}


/* ==================================================
   MOVIE
================================================== */

.movie{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  background:#000;

  opacity:0;

  transform-origin:center center;

  filter:
    contrast(1.06)
    saturate(1.08);

  will-change:
    transform,
    opacity,
    filter;
}

.movie.active{
  opacity:1;
}

.movie.motion{
  animation:
    cinematicMotion
    var(--movie-duration, 8s)
    linear
    forwards;
}

@keyframes cinematicMotion{

  0%{
    transform:scale(1.035);

    filter:
      contrast(1.18)
      saturate(1.18)
      brightness(1.04);
  }

  10%{
    transform:scale(1.015);
  }

  100%{
    transform:scale(1.07);

    filter:
      contrast(1.10)
      saturate(1.12)
      brightness(.98);
  }
}


/* ==================================================
   CINEMATIC SHADE
================================================== */

.movie-shade{
  position:absolute;
  inset:0;

  z-index:5;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.05) 0%,
      transparent 28%,
      transparent 72%,
      rgba(0,0,0,.14) 100%
    );
}


/* ==================================================
   4 PANEL OVERLAY
================================================== */

.panel-grid{
  position:absolute;
  inset:0;

  z-index:8;

  display:grid;
  grid-template-columns:
    repeat(4,1fr);

  pointer-events:none;
}

.panel{
  position:relative;

  opacity:0;

  transform:translateX(0);

  transition:
    opacity .22s ease,
    transform .22s ease;

  background:
    linear-gradient(
      180deg,
      rgba(170,0,20,.18) 0%,
      rgba(220,0,28,.10) 52%,
      rgba(120,0,15,.15) 100%
    );

  mix-blend-mode:multiply;
}


/* ほんの少し赤い光も重ねる */

.panel::after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,40,55,.12) 50%,
      transparent 100%
    );

  mix-blend-mode:screen;
}


.panel.active{
  opacity:var(--panel-opacity,.14);
}

.panel.shift-left{
  transform:translateX(-4px);
}

.panel.shift-right{
  transform:translateX(4px);
}


/* ==================================================
   SCANLINES
================================================== */

.scanlines{
  position:absolute;
  inset:0;

  z-index:9;

  pointer-events:none;

  opacity:.045;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.18) 0px,
      rgba(255,255,255,.18) 1px,
      transparent 1px,
      transparent 5px
    );
}


/* ==================================================
   CORNER FRAME
================================================== */

.corner{
  position:absolute;

  width:31px;
  height:31px;

  z-index:14;

  pointer-events:none;

  opacity:.86;
}

.corner.tl{
  top:12px;
  left:12px;

  border-top:2px solid rgba(255,255,255,.88);
  border-left:2px solid #e40025;
}

.corner.tr{
  top:12px;
  right:12px;

  border-top:2px solid rgba(255,255,255,.88);
  border-right:2px solid #e40025;
}

.corner.bl{
  bottom:12px;
  left:12px;

  border-bottom:2px solid rgba(255,255,255,.88);
  border-left:2px solid #e40025;
}

.corner.br{
  bottom:12px;
  right:12px;

  border-bottom:2px solid rgba(255,255,255,.88);
  border-right:2px solid #e40025;
}


/* ==================================================
   FAST LIGHT SWEEP
================================================== */

.light-sweep{
  position:absolute;

  top:0;
  left:-65%;

  width:48%;
  height:100%;

  z-index:12;

  opacity:0;

  pointer-events:none;

  transform:skewX(-12deg);

  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,20,40,.02) 22%,
      rgba(255,20,40,.18) 48%,
      rgba(255,255,255,.30) 52%,
      rgba(255,20,40,.12) 57%,
      transparent 100%
    );
}

.light-sweep.fire{
  animation:
    lightSweep .62s
    cubic-bezier(.12,.76,.18,1);
}

@keyframes lightSweep{

  0%{
    left:-65%;
    opacity:0;
  }

  12%{
    opacity:1;
  }

  100%{
    left:120%;
    opacity:0;
  }
}


/* ==================================================
   HORIZONTAL RED BEAM
================================================== */

.red-beam{
  position:absolute;

  left:-50%;
  top:var(--beam-y,50%);

  width:46%;
  height:2px;

  z-index:15;

  opacity:0;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,0,30,.40) 20%,
      #ff1735 46%,
      #fff 52%,
      #ff1735 58%,
      transparent 100%
    );

  box-shadow:
    0 0 8px
    rgba(255,0,30,.5);
}

.red-beam.fire{
  animation:
    redBeamMove .50s
    cubic-bezier(.10,.78,.18,1);
}

@keyframes redBeamMove{

  0%{
    left:-50%;
    opacity:0;
  }

  10%{
    opacity:1;
  }

  100%{
    left:110%;
    opacity:0;
  }
}


/* ==================================================
   SWITCH FLASH
================================================== */

.switch-flash{
  position:absolute;
  inset:0;

  z-index:25;

  background:#fff;

  opacity:0;

  pointer-events:none;
}

.switch-flash.fire{
  animation:
    switchFlash .24s ease;
}

@keyframes switchFlash{

  0%{
    opacity:0;
  }

  28%{
    opacity:.72;
  }

  100%{
    opacity:0;
  }
}


/* ==================================================
   COPY AREA
================================================== */

.hero-copy{
  width:100%;

  overflow:hidden;

  padding:
    31px
    0
    46px
    22px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(140,0,15,.18),
      transparent 43%
    ),
    #000;
}


/* ==================================================
   MAIN TITLE
================================================== */

.main-title{
  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;
}

.main-title.play{
  animation:
    titleHit .68s
    cubic-bezier(.08,.82,.2,1);
}

@keyframes titleHit{

  0%{
    opacity:0;

    transform:
      translateX(-42px)
      scale(1.13);

    filter:blur(7px);
  }

  48%{
    opacity:1;

    transform:
      translateX(6px)
      scale(1.02);

    filter:blur(1px);
  }

  100%{
    opacity:1;

    transform:
      translateX(0)
      scale(1);

    filter:blur(0);
  }
}


/* ==================================================
   COUNTERATTACK
================================================== */

.catch{
  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;
  font-style:italic;

  letter-spacing:.012em;

  white-space:nowrap;
}

.catch.play{
  animation:
    catchHit .58s ease;
}

@keyframes catchHit{

  0%{
    opacity:0;

    transform:
      translateX(-26px);

    filter:blur(6px);
  }

  55%{
    opacity:1;

    transform:
      translateX(4px);

    filter:blur(1px);
  }

  100%{
    opacity:1;

    transform:
      translateX(0);

    filter:blur(0);
  }
}


/* ==================================================
   RED LINE UNDER COPY
================================================== */

.red-line{
  width:
    calc(100vw - 22px);

  height:4px;

  margin-top:20px;

  transform-origin:left center;

  background:
    linear-gradient(
      90deg,
      #ed001d 0%,
      #ff1931 65%,
      transparent 100%
    );
}

.red-line.play{
  animation:
    copyBeam .75s
    cubic-bezier(.1,.8,.18,1);
}

@keyframes copyBeam{

  0%{
    transform:scaleX(0);
    filter:brightness(3);
  }

  100%{
    transform:scaleX(1);
    filter:brightness(1);
  }
}


/* ==================================================
   PC
================================================== */

@media(min-width:768px){

  .header{
    height:98px;
    padding:0 42px;
  }

  .brand-logo{
    width:70px;
    height:70px;
  }

  .brand-name{
    font-size:40px;
  }

  .menu span{
    width:36px;
    height:4px;
  }

  .hero-copy{
    padding:
      48px
      0
      65px
      6vw;
  }
}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

  <div class="brand">

    <img
      src="nf1.png"
      alt="NANYO FC"
      class="brand-logo"
    >

    <div class="brand-name">
      NANYO FC
    </div>

  </div>


  <div class="menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

</header>



<!-- MOVIE -->

<section class="movie-wrap">


  <video
    id="movieA"
    class="movie active"
    muted
    playsinline
    preload="auto">
  </video>


  <video
    id="movieB"
    class="movie"
    muted
    playsinline
    preload="metadata">
  </video>


  <div class="movie-shade"></div>


  <!-- 4分割パネル -->

  <div class="panel-grid">

    <div class="panel"></div>
    <div class="panel"></div>
    <div class="panel"></div>
    <div class="panel"></div>

  </div>


  <div class="scanlines"></div>


  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>


  <div
    id="lightSweep"
    class="light-sweep">
  </div>


  <div
    id="redBeam"
    class="red-beam">
  </div>


  <div
    id="switchFlash"
    class="switch-flash">
  </div>


</section>



<!-- COPY -->

<section class="hero-copy">


  <h1
    id="mainTitle"
    class="main-title">

    NANYO<br>
    FOOTBALL CLUB

  </h1>


  <div
    id="catchText"
    class="catch">

    COUNTERATTACK BEGINS

  </div>


  <div
    id="redLine"
    class="red-line">
  </div>


</section>



<script>


/* ==================================================
   MOVIES
================================================== */

const movies = [

  "movie/nf1.mp4",
  "movie/nf2.mp4",
  "movie/nf3.mp4",
  "movie/nf4.mp4",
  "movie/nf5.mp4",
  "movie/nf6.mp4"

];


const movieA =
  document.getElementById("movieA");

const movieB =
  document.getElementById("movieB");


const panels =
  document.querySelectorAll(".panel");


const lightSweep =
  document.getElementById("lightSweep");

const redBeam =
  document.getElementById("redBeam");

const switchFlash =
  document.getElementById("switchFlash");


const mainTitle =
  document.getElementById("mainTitle");

const catchText =
  document.getElementById("catchText");

const redLine =
  document.getElementById("redLine");


let activeMovie =
  movieA;

let standbyMovie =
  movieB;

let playlist = [];

let previousMovie =
  null;

let switching =
  false;


let panelTimer =
  null;

let beamTimer =
  null;

let sweepTimer =
  null;


/* ==================================================
   SHUFFLE
================================================== */

function shuffleMovies(){

  playlist = [...movies];

  for(
    let i = playlist.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      playlist[i],
      playlist[j]
    ] = [
      playlist[j],
      playlist[i]
    ];

  }


  if(
    previousMovie &&
    playlist.length > 1 &&
    playlist[0] === previousMovie
  ){

    [
      playlist[0],
      playlist[1]
    ] = [
      playlist[1],
      playlist[0]
    ];

  }
}


function getNextMovie(){

  if(playlist.length === 0){
    shuffleMovies();
  }

  const next =
    playlist.shift();

  previousMovie =
    next;

  return next;
}


/* ==================================================
   ANIMATION RESTART
================================================== */

function restart(
  element,
  className
){

  element
    .classList
    .remove(className);

  void element.offsetWidth;

  element
    .classList
    .add(className);
}


/* ==================================================
   4 PANEL RANDOM
================================================== */

function randomPanels(){

  panels.forEach(panel => {

    panel.classList.remove(
      "active",
      "shift-left",
      "shift-right"
    );

  });


  /*
    1〜2枚だけ反応させる
  */

  const panelCount =
    Math.random() < .72
      ? 1
      : 2;


  const available =
    [0,1,2,3];


  for(
    let i = 0;
    i < panelCount;
    i++
  ){

    const randomIndex =
      Math.floor(
        Math.random() *
        available.length
      );


    const panelNumber =
      available.splice(
        randomIndex,
        1
      )[0];


    const panel =
      panels[panelNumber];


    const opacity =
      (
        Math.random() *
        .10 +
        .07
      )
      .toFixed(2);


    panel.style.setProperty(
      "--panel-opacity",
      opacity
    );


    panel.classList.add(
      "active"
    );


    const shift =
      Math.random();


    if(shift < .18){

      panel.classList.add(
        "shift-left"
      );

    }else if(shift > .82){

      panel.classList.add(
        "shift-right"
      );

    }

  }

}


function startPanelMotion(){

  clearInterval(
    panelTimer
  );


  randomPanels();


  panelTimer =
    setInterval(
      randomPanels,
      520
    );

}


/* ==================================================
   LIGHT SWEEP
================================================== */

function fireLightSweep(){

  restart(
    lightSweep,
    "fire"
  );

}


function startLightSweep(){

  clearInterval(
    sweepTimer
  );


  sweepTimer =
    setInterval(
      fireLightSweep,
      3100
    );

}


/* ==================================================
   RED BEAM
================================================== */

function fireRedBeam(){

  const y =
    18 +
    Math.random() * 64;


  redBeam.style.setProperty(
    "--beam-y",
    y + "%"
  );


  restart(
    redBeam,
    "fire"
  );

}


function startRedBeam(){

  clearInterval(
    beamTimer
  );


  beamTimer =
    setInterval(
      fireRedBeam,
      2250
    );

}


/* ==================================================
   TEXT FX
================================================== */

function replayText(){

  restart(
    mainTitle,
    "play"
  );


  setTimeout(() => {

    restart(
      catchText,
      "play"
    );

  },110);


  setTimeout(() => {

    restart(
      redLine,
      "play"
    );

  },230);

}


/* ==================================================
   VIDEO MOTION
================================================== */

function startMovieMotion(video){

  video
    .classList
    .remove("motion");


  void video.offsetWidth;


  video
    .classList
    .add("motion");

}


/* ==================================================
   PREPARE NEXT
================================================== */

function prepareNext(){

  standbyMovie.src =
    getNextMovie();


  standbyMovie.load();

}


/* ==================================================
   SWITCH MOVIE
================================================== */

function switchMovie(){

  if(switching){
    return;
  }


  switching =
    true;


  restart(
    switchFlash,
    "fire"
  );


  setTimeout(() => {


    standbyMovie.currentTime =
      0;


    standbyMovie.play()

      .then(() => {


        standbyMovie
          .classList
          .add("active");


        activeMovie
          .classList
          .remove("active");


        startMovieMotion(
          standbyMovie
        );


        replayText();


        fireLightSweep();


        setTimeout(() => {


          activeMovie.pause();


          activeMovie
            .classList
            .remove("motion");


          const oldMovie =
            activeMovie;


          activeMovie =
            standbyMovie;


          standbyMovie =
            oldMovie;


          prepareNext();


          switching =
            false;


        },420);


      })

      .catch(() => {

        switching =
          false;

      });


  },90);

}


/* ==================================================
   VIDEO METADATA
================================================== */

movieA.addEventListener(
  "loadedmetadata",
  () => {

    movieA.style.setProperty(
      "--movie-duration",
      movieA.duration + "s"
    );

  }
);


movieB.addEventListener(
  "loadedmetadata",
  () => {

    movieB.style.setProperty(
      "--movie-duration",
      movieB.duration + "s"
    );

  }
);


/* ==================================================
   START
================================================== */

function start(){

  shuffleMovies();


  activeMovie.src =
    getNextMovie();


  activeMovie.load();


  activeMovie.play()
    .catch(() => {});


  prepareNext();


  activeMovie.addEventListener(
    "loadedmetadata",
    () => {


      startMovieMotion(
        activeMovie
      );


      replayText();


      startPanelMotion();


      startLightSweep();


      startRedBeam();


      setTimeout(
        fireLightSweep,
        500
      );


    },
    {
      once:true
    }
  );

}


/* ==================================================
   END
================================================== */

movieA.addEventListener(
  "ended",
  switchMovie
);


movieB.addEventListener(
  "ended",
  switchMovie
);


start();


</script>


</body>

</html>
