<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NANYO FOOTBALL CLUB</title>


<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

.header{
  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b6001d 55%,
      #980018 100%
    );

  position:relative;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{
  width:56px;
  height:56px;
  object-fit:contain;
  display:block;
}

.brand-name{
  color:#fff;
  font-size:31px;
  line-height:1;
  font-weight:900;
  letter-spacing:.055em;
  white-space:nowrap;
}

.menu{
  width:48px;
  height:48px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:7px;
}

.menu span{
  width:30px;
  height:3px;
  display:block;
  border-radius:3px;
  background:#d7b24a;
}


/* =========================
   MOVIE
========================= */

.movie-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16 / 9;
  overflow:hidden;
  background:#000;
}

.movie{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  background:#000;

  opacity:0;

  z-index:1;
}

.movie.active{
  opacity:1;
}


/* =========================
   BLACK CUT
========================= */

.cut-black{
  position:absolute;
  inset:0;

  background:#000;

  opacity:0;

  z-index:10;

  pointer-events:none;
}


/* =========================
   SUBTLE RED FLASH
========================= */

.red-flash{
  position:absolute;
  inset:0;

  z-index:9;

  opacity:0;

  pointer-events:none;

  background:
    linear-gradient(
      110deg,
      transparent 15%,
      rgba(220,0,35,.22) 48%,
      transparent 76%
    );
}


/* =========================
   COPY
========================= */

.hero-copy{
  width:100%;
  overflow:hidden;

  padding:
    31px
    0
    46px
    22px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(140,0,15,.18),
      transparent 43%
    ),
    #000;
}

.main-title{
  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;

  will-change:
    transform,
    opacity,
    filter;
}

.catch{
  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;
  font-style:italic;

  white-space:nowrap;

  will-change:
    transform,
    opacity;
}

.red-line{
  width:
    calc(100vw - 22px);

  height:4px;

  margin-top:20px;

  transform-origin:left center;

  background:
    linear-gradient(
      90deg,
      #ed001d 0%,
      #ff1931 65%,
      transparent 100%
    );

  will-change:
    transform,
    opacity;
}


/* =========================
   PC
========================= */

@media(min-width:768px){

  .header{
    height:98px;
    padding:0 42px;
  }

  .brand-logo{
    width:70px;
    height:70px;
  }

  .brand-name{
    font-size:40px;
  }

  .menu span{
    width:36px;
    height:4px;
  }

  .hero-copy{
    padding:
      48px
      0
      65px
      6vw;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="brand">

    <img
      src="nf1.png"
      alt="NANYO FC"
      class="brand-logo"
    >

    <div class="brand-name">
      NANYO FC
    </div>

  </div>


  <div class="menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

</header>



<section class="movie-wrap">

  <video
    id="movieA"
    class="movie active"
    muted
    playsinline
    webkit-playsinline
    preload="auto">
  </video>


  <video
    id="movieB"
    class="movie"
    muted
    playsinline
    webkit-playsinline
    preload="auto">
  </video>


  <div
    id="redFlash"
    class="red-flash">
  </div>


  <div
    id="cutBlack"
    class="cut-black">
  </div>

</section>



<section class="hero-copy">

  <h1
    id="mainTitle"
    class="main-title">

    NANYO<br>
    FOOTBALL CLUB

  </h1>


  <div
    id="catchText"
    class="catch">

    COUNTERATTACK BEGINS

  </div>


  <div
    id="redLine"
    class="red-line">
  </div>

</section>



<script>

/* =========================
   MOVIES
========================= */

const movies = [

  "movie/nf1.mp4",
  "movie/nf2.mp4",
  "movie/nf3.mp4",
  "movie/nf4.mp4",
  "movie/nf5.mp4",
  "movie/nf6.mp4"

];


const movieA =
  document.getElementById("movieA");

const movieB =
  document.getElementById("movieB");

const cutBlack =
  document.getElementById("cutBlack");

const redFlash =
  document.getElementById("redFlash");

const mainTitle =
  document.getElementById("mainTitle");

const catchText =
  document.getElementById("catchText");

const redLine =
  document.getElementById("redLine");


let activeVideo = movieA;
let standbyVideo = movieB;

let playlist = [];

let lastMovie = null;

let switching = false;

let waitingForStandby = false;


/* =========================
   RANDOM
========================= */

function shuffleMovies(){

  playlist = [...movies];


  for(
    let i = playlist.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      playlist[i],
      playlist[j]
    ] = [
      playlist[j],
      playlist[i]
    ];

  }


  /*
    一巡の境目も
    同じ動画を連続させない
  */

  if(
    lastMovie &&
    playlist.length > 1 &&
    playlist[0] === lastMovie
  ){

    [
      playlist[0],
      playlist[1]
    ] = [
      playlist[1],
      playlist[0]
    ];

  }

}


function getNextMovie(){

  if(playlist.length === 0){
    shuffleMovies();
  }


  const next =
    playlist.shift();


  lastMovie =
    next;


  return next;

}


/* =========================
   TEXT EFFECT
========================= */

function animateText(){

  /*
    古いアニメーションを
    全部強制終了
  */

  mainTitle
    .getAnimations()
    .forEach(a => a.cancel());

  catchText
    .getAnimations()
    .forEach(a => a.cancel());

  redLine
    .getAnimations()
    .forEach(a => a.cancel());


  /*
    NANYO FOOTBALL CLUB
  */

  mainTitle.animate(

    [
      {
        opacity:0,
        transform:"translateX(-42px)",
        filter:"blur(5px)"
      },

      {
        opacity:1,
        transform:"translateX(0)",
        filter:"blur(0)"
      }
    ],

    {
      duration:720,
      easing:"cubic-bezier(.12,.80,.20,1)",
      fill:"both"
    }

  );


  /*
    COUNTERATTACK BEGINS
  */

  catchText.animate(

    [
      {
        opacity:0,
        transform:"translateX(32px)"
      },

      {
        opacity:1,
        transform:"translateX(0)"
      }
    ],

    {
      duration:650,
      delay:170,
      easing:"cubic-bezier(.12,.80,.20,1)",
      fill:"both"
    }

  );


  /*
    赤ライン
  */

  redLine.animate(

    [
      {
        opacity:0,
        transform:"scaleX(0)"
      },

      {
        opacity:1,
        transform:"scaleX(1)"
      }
    ],

    {
      duration:800,
      delay:320,
      easing:"cubic-bezier(.10,.80,.18,1)",
      fill:"both"
    }

  );

}


/* =========================
   MOVIE ZOOM
========================= */

function animateMovie(video){

  video
    .getAnimations()
    .forEach(a => a.cancel());


  const duration =
    Number.isFinite(video.duration)
    ?
    video.duration * 1000
    :
    8000;


  video.animate(

    [
      {
        transform:"scale(1.00)"
      },

      {
        transform:"scale(1.035)"
      }
    ],

    {
      duration:duration,
      easing:"linear",
      fill:"forwards"
    }

  );

}


/* =========================
   PRELOAD
========================= */

function preloadNext(){

  standbyVideo.src =
    getNextMovie();


  standbyVideo.load();

}


/* =========================
   TRANSITION EFFECT
========================= */

function transitionEffect(){

  cutBlack
    .getAnimations()
    .forEach(a => a.cancel());


  redFlash
    .getAnimations()
    .forEach(a => a.cancel());


  /*
    赤い光がサッと横切る
  */

  redFlash.animate(

    [
      {
        opacity:0,
        transform:"translateX(-50%)"
      },

      {
        opacity:.8,
        transform:"translateX(0)"
      },

      {
        opacity:0,
        transform:"translateX(50%)"
      }
    ],

    {
      duration:420,
      easing:"ease-out"
    }

  );


  /*
    暗転時間は毎回420ms固定
  */

  cutBlack.animate(

    [
      {
        opacity:0
      },

      {
        opacity:1,
        offset:.42
      },

      {
        opacity:1,
        offset:.58
      },

      {
        opacity:0
      }
    ],

    {
      duration:420,
      easing:"linear"
    }

  );

}


/* =========================
   SWITCH
========================= */

function switchMovie(){

  if(switching){
    return;
  }


  /*
    次の動画がまだ読めてなければ
    最後の画面を残したまま待つ。

    黒画面にはしない。
  */

  if(standbyVideo.readyState < 2){

    if(waitingForStandby){
      return;
    }


    waitingForStandby = true;


    standbyVideo.addEventListener(

      "loadeddata",

      () => {

        waitingForStandby = false;

        switchMovie();

      },

      {
        once:true
      }

    );


    return;
  }


  switching = true;


  transitionEffect();


  /*
    暗転の真ん中で
    動画を入れ替える
  */

  setTimeout(

    () => {


      standbyVideo.currentTime = 0;


      standbyVideo
        .play()
        .catch(() => {});


      activeVideo
        .classList
        .remove("active");


      standbyVideo
        .classList
        .add("active");


      activeVideo.pause();


      animateMovie(
        standbyVideo
      );


      /*
        動画が変わるたび
        必ず文字を動かす
      */

      animateText();


      const old =
        activeVideo;


      activeVideo =
        standbyVideo;


      standbyVideo =
        old;


      preloadNext();


    },

    210

  );


  setTimeout(

    () => {

      switching = false;

    },

    470

  );

}


/* =========================
   ENDED
========================= */

movieA.addEventListener(
  "ended",
  switchMovie
);


movieB.addEventListener(
  "ended",
  switchMovie
);


/* =========================
   START
========================= */

function start(){

  shuffleMovies();


  /*
    最初の動画
  */

  activeVideo.src =
    getNextMovie();


  activeVideo.load();


  /*
    次動画を裏で読込
  */

  preloadNext();


  const begin = () => {


    activeVideo
      .play()
      .catch(() => {});


    animateMovie(
      activeVideo
    );


    /*
      初回も文字を動かす
    */

    setTimeout(
      animateText,
      150
    );

  };


  if(
    activeVideo.readyState >= 2
  ){

    begin();

  }

  else{

    activeVideo.addEventListener(

      "loadeddata",

      begin,

      {
        once:true
      }

    );

  }

}


start();

</script>


</body>

</html>
