<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NANYO FOOTBALL CLUB</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #000;
    }


    /* -------------------------
       背景動画
       画面いっぱい＋ぼかし
    ------------------------- */

    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 110%;
      height: 110%;

      transform: translate(-50%, -50%) scale(1.08);

      object-fit: cover;

      filter: blur(18px);
      opacity: 0;

      transition: opacity 0.8s ease;

      z-index: 0;
    }

    .bg-video.active {
      opacity: 0.55;
    }


    /* -------------------------
       メイン動画
       16:9を絶対に切らない
    ------------------------- */

    .main-video {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 100%;
      height: auto;

      max-height: 100%;

      object-fit: contain;

      opacity: 0;

      transition: opacity 0.8s ease;

      z-index: 1;
    }

    .main-video.active {
      opacity: 1;
    }


    /* 黒フィルター */

    .hero-overlay {
      position: absolute;
      inset: 0;

      z-index: 2;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.30) 0%,
          rgba(0,0,0,0.05) 38%,
          rgba(0,0,0,0.10) 60%,
          rgba(0,0,0,0.75) 100%
        );

      pointer-events: none;
    }


    /* -------------------------
       HEADER
    ------------------------- */

    .header {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        calc(20px + env(safe-area-inset-top))
        24px
        20px;

      z-index: 10;
    }

    .header-name {
      color: #fff;

      font-size: 15px;
      font-weight: 900;

      letter-spacing: 0.25em;
    }

    .menu {
      width: 44px;
      height: 44px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 7px;
    }

    .menu span {
      display: block;

      width: 27px;
      height: 2px;

      background: #fff;
    }


    /* -------------------------
       メイン文字
    ------------------------- */

    .hero-content {
      position: absolute;

      left: 24px;
      right: 24px;

      bottom: 82px;

      z-index: 10;
    }

    .club-name {
      color: #fff;

      font-size: clamp(35px, 10vw, 74px);

      line-height: 0.92;

      font-weight: 900;

      letter-spacing: -0.045em;

      text-shadow:
        0 2px 12px rgba(0,0,0,0.45);

      opacity: 0;

      transform: translateY(24px);

      animation: titleIn 0.9s ease forwards;

      animation-delay: 0.35s;
    }

    .catch {
      margin-top: 16px;

      color: #ef1717;

      font-size: clamp(18px, 5vw, 34px);

      font-weight: 900;
      font-style: italic;

      letter-spacing: 0.035em;

      white-space: nowrap;

      text-shadow:
        0 2px 10px rgba(0,0,0,0.55);

      opacity: 0;

      transform: translateX(-20px);

      animation: catchIn 0.8s ease forwards;

      animation-delay: 0.85s;
    }

    .red-line {
      width: 0;
      height: 3px;

      margin-top: 18px;

      background: #ef1717;

      animation: lineIn 1s ease forwards;

      animation-delay: 1.1s;
    }


    /* -------------------------
       SCROLL
    ------------------------- */

    .scroll {
      position: absolute;

      left: 50%;
      bottom: 18px;

      transform: translateX(-50%);

      color: rgba(255,255,255,0.8);

      font-size: 9px;

      letter-spacing: 0.30em;

      z-index: 10;

      text-align: center;
    }

    .scroll::after {
      content: "";

      display: block;

      width: 1px;
      height: 25px;

      margin: 8px auto 0;

      background: rgba(255,255,255,0.8);

      animation: scrollMove 1.5s ease-in-out infinite;
    }


    /* -------------------------
       ANIMATION
    ------------------------- */

    @keyframes titleIn {

      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes catchIn {

      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }

    }


    @keyframes lineIn {

      from {
        width: 0;
      }

      to {
        width: 150px;
      }

    }


    @keyframes scrollMove {

      0% {
        opacity: 0.25;
        transform: scaleY(0.25);
        transform-origin: top;
      }

      50% {
        opacity: 1;
        transform: scaleY(1);
        transform-origin: top;
      }

      100% {
        opacity: 0.25;
        transform: scaleY(0.25);
        transform-origin: top;
      }

    }


    /* PC */

    @media (min-width: 768px) {

      .header {
        padding: 32px 50px;
      }

      .hero-content {
        left: 6vw;
        bottom: 10vh;
      }

      .club-name {
        font-size: clamp(60px, 7vw, 110px);
      }

      .catch {
        font-size: clamp(25px, 2.8vw, 48px);
      }

    }

  </style>
</head>


<body>


<section class="hero">


  <!-- 背景動画 -->

  <video
    id="bgA"
    class="bg-video active"
    muted
    playsinline
    preload="metadata">
  </video>

  <video
    id="bgB"
    class="bg-video"
    muted
    playsinline
    preload="metadata">
  </video>


  <!-- メイン動画 -->

  <video
    id="mainA"
    class="main-video active"
    muted
    playsinline
    preload="auto">
  </video>

  <video
    id="mainB"
    class="main-video"
    muted
    playsinline
    preload="metadata">
  </video>


  <div class="hero-overlay"></div>


  <header class="header">

    <div class="header-name">
      NANYO FC
    </div>

    <div class="menu">
      <span></span>
      <span></span>
    </div>

  </header>


  <div class="hero-content">

    <h1 class="club-name">
      NANYO<br>
      FOOTBALL CLUB
    </h1>

    <div class="catch">
      COUNTERATTACK BEGINS
    </div>

    <div class="red-line"></div>

  </div>


  <div class="scroll">
    SCROLL
  </div>


</section>



<script>

const movies = [

  "movie/nf1.mp4",
  "movie/nf2.mp4",
  "movie/nf3.mp4",
  "movie/nf4.mp4",
  "movie/nf5.mp4",
  "movie/nf6.mp4"

];


const bgA = document.getElementById("bgA");
const bgB = document.getElementById("bgB");

const mainA = document.getElementById("mainA");
const mainB = document.getElementById("mainB");


let activeMain = mainA;
let standbyMain = mainB;

let activeBg = bgA;
let standbyBg = bgB;

let playlist = [];


function shuffleMovies() {

  playlist = [...movies];

  for (let i = playlist.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [
      playlist[i],
      playlist[j]

    ] = [

      playlist[j],
      playlist[i]

    ];

  }

}


function getNextMovie() {

  if (playlist.length === 0) {

    shuffleMovies();

  }

  return playlist.shift();

}


function setVideoPair(mainVideo, bgVideo, src) {

  mainVideo.src = src;
  bgVideo.src = src;

  mainVideo.load();
  bgVideo.load();

}


function playPair(mainVideo, bgVideo) {

  mainVideo.currentTime = 0;
  bgVideo.currentTime = 0;

  mainVideo.play().catch(() => {});
  bgVideo.play().catch(() => {});

}


function prepareNext() {

  const nextMovie = getNextMovie();

  setVideoPair(
    standbyMain,
    standbyBg,
    nextMovie
  );

}


function switchVideo() {

  playPair(
    standbyMain,
    standbyBg
  );


  standbyMain.classList.add("active");
  standbyBg.classList.add("active");


  activeMain.classList.remove("active");
  activeBg.classList.remove("active");


  setTimeout(() => {

    activeMain.pause();
    activeBg.pause();


    const oldMain = activeMain;
    activeMain = standbyMain;
    standbyMain = oldMain;


    const oldBg = activeBg;
    activeBg = standbyBg;
    standbyBg = oldBg;


    prepareNext();

  }, 850);

}


function start() {

  shuffleMovies();

  const firstMovie =
    getNextMovie();


  setVideoPair(
    activeMain,
    activeBg,
    firstMovie
  );


  playPair(
    activeMain,
    activeBg
  );


  prepareNext();

}


mainA.addEventListener(
  "ended",
  switchVideo
);

mainB.addEventListener(
  "ended",
  switchVideo
);


start();

</script>


</body>
</html>
