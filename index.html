<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NANYO FOOTBALL CLUB</title>


<style>


/* =====================================
   RESET
===================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


html,
body{
  width:100%;
  background:#000;
  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}


body{
  overflow-x:hidden;
}



/* =====================================
   HEADER
===================================== */

.header{

  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #c60022 0%,
      #ae001d 55%,
      #980019 100%
    );

  position:relative;

  z-index:20;
}



/* =====================================
   BRAND
===================================== */

.brand{

  display:flex;

  align-items:center;

  gap:13px;

  min-width:0;
}



/* ロゴ */

.brand-logo{

  width:56px;
  height:56px;

  flex:0 0 56px;

  display:block;

  object-fit:contain;
}



/* NANYO FC */

.brand-name{

  color:#fff;

  font-size:31px;

  line-height:1;

  font-weight:900;

  letter-spacing:.055em;

  white-space:nowrap;

  text-shadow:
    0 2px 4px rgba(0,0,0,.18);
}



/* =====================================
   HAMBURGER
===================================== */

.menu{

  width:48px;
  height:48px;

  flex:0 0 48px;

  display:flex;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:7px;
}



.menu span{

  display:block;

  width:30px;
  height:3px;

  border-radius:3px;

  /* 普通のゴールド */

  background:#d8b44a;
}



/* =====================================
   MOVIE
===================================== */

.movie-wrap{

  position:relative;

  width:100%;

  aspect-ratio:16 / 9;

  overflow:hidden;

  background:#000;
}



.movie{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;

  object-position:center;

  background:#000;

  opacity:0;

  transform:scale(1);

  transition:
    opacity .48s ease,
    transform 8s linear;
}



.movie.active{

  opacity:1;

  transform:scale(1.025);
}



/* 動画を少し締める */

.movie-shade{

  position:absolute;

  inset:0;

  z-index:5;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,

      rgba(0,0,0,.04) 0%,
      rgba(0,0,0,0) 55%,
      rgba(0,0,0,.13) 100%
    );
}



/* =====================================
   FLASH
===================================== */

.flash{

  position:absolute;

  inset:0;

  z-index:10;

  background:#fff;

  opacity:0;

  pointer-events:none;
}



.flash.fire{

  animation:
    flashEffect .27s ease;
}



@keyframes flashEffect{

  0%{
    opacity:0;
  }

  28%{
    opacity:.68;
  }

  100%{
    opacity:0;
  }

}



/* =====================================
   VIDEO下 TEXT AREA
===================================== */

.hero-copy{

  width:100%;

  overflow:hidden;

  padding:

    32px
    0
    46px
    22px;

  background:

    radial-gradient(
      circle at 100% 0%,
      rgba(120,0,15,.15),
      transparent 42%
    ),

    #000;
}



/* =====================================
   NANYO FOOTBALL CLUB
===================================== */

.main-title{

  padding-right:22px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;
}



.main-title.play{

  animation:
    mainTitleAnimation
    .75s
    cubic-bezier(.16,.8,.25,1);
}



@keyframes mainTitleAnimation{

  0%{

    opacity:0;

    transform:
      translateY(22px);

    filter:
      blur(5px);

  }


  100%{

    opacity:1;

    transform:
      translateY(0);

    filter:
      blur(0);

  }

}



/* =====================================
   COUNTERATTACK
===================================== */

.catch{

  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;

  font-style:italic;

  letter-spacing:.012em;

  white-space:nowrap;
}



.catch.play{

  animation:
    catchAnimation
    .58s ease;
}



@keyframes catchAnimation{

  0%{

    opacity:0;

    transform:
      translateX(-28px);

    filter:
      blur(7px);

  }


  45%{

    opacity:1;

    transform:
      translateX(5px);

    filter:
      blur(1px);

  }


  60%{

    transform:
      translateX(-3px);

  }


  76%{

    transform:
      translateX(2px);

  }


  100%{

    opacity:1;

    transform:
      translateX(0);

    filter:
      blur(0);

  }

}



/* =====================================
   RED LINE
===================================== */

.red-line{

  height:3px;

  margin-top:20px;

  width:
    calc(100vw - 22px);

  transform-origin:left center;

  background:
    linear-gradient(
      90deg,

      #ef101b 0%,
      #ff2029 72%,
      rgba(255,32,41,.1) 100%
    );
}



.red-line.play{

  animation:
    redLineAnimation
    .9s
    cubic-bezier(.2,.8,.2,1);
}



@keyframes redLineAnimation{

  0%{

    transform:
      scaleX(0);

    opacity:.2;

  }


  100%{

    transform:
      scaleX(1);

    opacity:1;

  }

}



/* =====================================
   PC
===================================== */

@media(min-width:768px){


  .header{

    height:98px;

    padding:
      0 42px;

  }


  .brand-logo{

    width:70px;
    height:70px;

    flex-basis:70px;

  }


  .brand-name{

    font-size:40px;

  }


  .menu{

    width:56px;
    height:56px;

  }


  .menu span{

    width:36px;
    height:4px;

  }


  .hero-copy{

    padding:

      48px
      0
      65px
      6vw;

  }


  .main-title{

    font-size:
      clamp(
        68px,
        7vw,
        110px
      );

  }


  .catch{

    font-size:
      clamp(
        28px,
        3vw,
        48px
      );

  }


  .red-line{

    width:
      calc(100vw - 6vw);

  }

}


</style>

</head>



<body>



<!-- =====================================
     HEADER
===================================== -->

<header class="header">


  <div class="brand">


    <img

      src="nf1.png"

      alt="NANYO FC"

      class="brand-logo"

    >


    <div class="brand-name">

      NANYO FC

    </div>


  </div>



  <div class="menu">

    <span></span>
    <span></span>
    <span></span>

  </div>


</header>




<!-- =====================================
     MOVIE
===================================== -->

<section class="movie-wrap">


  <video

    id="movieA"

    class="movie active"

    muted

    playsinline

    preload="auto">

  </video>



  <video

    id="movieB"

    class="movie"

    muted

    playsinline

    preload="metadata">

  </video>



  <div class="movie-shade"></div>


  <div
    id="flash"
    class="flash">
  </div>


</section>




<!-- =====================================
     TEXT
===================================== -->

<section class="hero-copy">


  <h1

    id="mainTitle"

    class="main-title">

    NANYO<br>

    FOOTBALL CLUB

  </h1>



  <div

    id="catchText"

    class="catch">

    COUNTERATTACK BEGINS

  </div>



  <div

    id="redLine"

    class="red-line">

  </div>


</section>




<script>


/* =====================================
   VIDEO LIST
===================================== */

const movies = [

  "movie/nf1.mp4",

  "movie/nf2.mp4",

  "movie/nf3.mp4",

  "movie/nf4.mp4",

  "movie/nf5.mp4",

  "movie/nf6.mp4"

];



const movieA =
  document.getElementById("movieA");


const movieB =
  document.getElementById("movieB");


const flash =
  document.getElementById("flash");


const mainTitle =
  document.getElementById("mainTitle");


const catchText =
  document.getElementById("catchText");


const redLine =
  document.getElementById("redLine");



let activeMovie =
  movieA;


let standbyMovie =
  movieB;


let playlist = [];


let lastMovie =
  null;


let switching =
  false;



/* =====================================
   SHUFFLE
===================================== */

function shuffleMovies(){


  playlist =
    [...movies];


  for(

    let i =
      playlist.length - 1;

    i > 0;

    i--

  ){


    const j =

      Math.floor(

        Math.random()
        *
        (i + 1)

      );


    [

      playlist[i],
      playlist[j]

    ] = [

      playlist[j],
      playlist[i]

    ];

  }



  if(

    lastMovie &&

    playlist.length > 1 &&

    playlist[0] === lastMovie

  ){


    [

      playlist[0],
      playlist[1]

    ] = [

      playlist[1],
      playlist[0]

    ];

  }

}



/* =====================================
   NEXT
===================================== */

function getNextMovie(){


  if(
    playlist.length === 0
  ){

    shuffleMovies();

  }


  const next =
    playlist.shift();


  lastMovie =
    next;


  return next;

}



/* =====================================
   PRELOAD
===================================== */

function prepareNextMovie(){


  standbyMovie.src =
    getNextMovie();


  standbyMovie.load();

}



/* =====================================
   FLASH
===================================== */

function fireFlash(){


  flash.classList.remove(
    "fire"
  );


  void flash.offsetWidth;


  flash.classList.add(
    "fire"
  );

}



/* =====================================
   TEXT REPLAY
===================================== */

function replayTextAnimation(){


  mainTitle.classList.remove(
    "play"
  );


  catchText.classList.remove(
    "play"
  );


  redLine.classList.remove(
    "play"
  );


  void mainTitle.offsetWidth;


  mainTitle.classList.add(
    "play"
  );


  catchText.classList.add(
    "play"
  );


  redLine.classList.add(
    "play"
  );

}



/* =====================================
   SWITCH
===================================== */

function switchMovie(){


  if(switching){
    return;
  }


  switching =
    true;



  fireFlash();



  setTimeout(

    () => {


      standbyMovie.currentTime =
        0;


      standbyMovie.play()


      .then(

        () => {


          standbyMovie
          .classList
          .add("active");


          activeMovie
          .classList
          .remove("active");



          /*
             動画変更ごとに
             文字＋線も再演出
          */

          replayTextAnimation();



          setTimeout(

            () => {


              activeMovie.pause();



              const oldMovie =
                activeMovie;


              activeMovie =
                standbyMovie;


              standbyMovie =
                oldMovie;



              prepareNextMovie();



              switching =
                false;


            },

            500

          );


        }

      )


      .catch(

        () => {

          switching =
            false;

        }

      );


    },

    100

  );

}



/* =====================================
   START
===================================== */

function startMovies(){


  shuffleMovies();



  activeMovie.src =
    getNextMovie();


  activeMovie.load();



  activeMovie.play()
  .catch(
    () => {}
  );



  prepareNextMovie();



  replayTextAnimation();

}



/* =====================================
   EVENT
===================================== */

movieA.addEventListener(

  "ended",

  switchMovie

);


movieB.addEventListener(

  "ended",

  switchMovie

);



startMovies();


</script>


</body>

</html>
