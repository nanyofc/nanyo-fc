<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NANYO FOOTBALL CLUB</title>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  background:#000;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

.header{
  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b6001d 55%,
      #980018 100%
    );

  position:relative;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{
  width:56px;
  height:56px;

  display:block;
  object-fit:contain;
}

.brand-name{
  color:#fff;

  font-size:31px;
  line-height:1;

  font-weight:900;
  letter-spacing:.055em;

  white-space:nowrap;
}

.menu{
  width:48px;
  height:48px;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:7px;
}

.menu span{
  display:block;

  width:30px;
  height:3px;

  border-radius:3px;

  background:#d7b24a;
}


/* =========================
   MOVIE
========================= */

.movie-wrap{
  position:relative;

  width:100%;
  aspect-ratio:16 / 9;

  overflow:hidden;

  background:#000;
}

.movie{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  background:#000;

  opacity:0;

  transform:scale(1);

  transition:
    opacity .4s ease;

  will-change:
    transform,
    opacity;
}

.movie.active{
  opacity:1;
}

.movie.motion{
  animation:
    movieMotion
    var(--movie-duration, 8s)
    linear
    forwards;
}

@keyframes movieMotion{

  from{
    transform:scale(1.01);
  }

  to{
    transform:scale(1.04);
  }

}


/* 動画をほんの少し締める */

.movie-shade{
  position:absolute;
  inset:0;

  z-index:2;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.02) 0%,
      transparent 55%,
      rgba(0,0,0,.06) 100%
    );
}


/* =========================
   SVG MARK
========================= */

.mark-layer{
  position:absolute;
  inset:0;

  z-index:3;

  pointer-events:none;

  overflow:hidden;
}

.mark-svg{
  width:100%;
  height:100%;

  display:block;
}


/*
  動画を邪魔しないように
  かなり薄い赤
*/

.mark-outline{
  fill:none;

  stroke:#e0002c;

  stroke-opacity:.11;

  stroke-width:3.5;

  stroke-linecap:round;
  stroke-linejoin:round;

  vector-effect:
    non-scaling-stroke;

  stroke-dasharray:1;
  stroke-dashoffset:1;
}


/*
  完成時に
  ごく薄く面も残す
*/

.mark-fill{
  fill:#d60028;

  fill-rule:evenodd;

  fill-opacity:0;
}


/* 8秒で完成 */

.mark-layer.play .mark-outline{
  animation:
    drawMark
    8s
    linear
    forwards;
}


/* 最後1秒くらいで
   ごく薄い面が入る */

.mark-layer.play .mark-fill{
  animation:
    fillMark
    1s
    ease
    7s
    forwards;
}


@keyframes drawMark{

  from{
    stroke-dashoffset:1;
  }

  to{
    stroke-dashoffset:0;
  }

}


@keyframes fillMark{

  from{
    fill-opacity:0;
  }

  to{
    fill-opacity:.025;
  }

}


/* =========================
   COPY AREA
========================= */

.hero-copy{
  width:100%;

  overflow:hidden;

  padding:
    31px
    0
    46px
    22px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(140,0,15,.18),
      transparent 43%
    ),
    #000;
}


/* =========================
   TITLE
========================= */

.main-title{
  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;
}

.main-title.play{
  animation:
    titleIn
    .65s
    cubic-bezier(.12,.8,.2,1);
}

@keyframes titleIn{

  from{
    opacity:0;

    transform:
      translateX(-28px);

    filter:
      blur(4px);
  }

  to{
    opacity:1;

    transform:
      translateX(0);

    filter:
      blur(0);
  }

}


/* =========================
   COUNTERATTACK
========================= */

.catch{
  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;
  font-style:italic;

  letter-spacing:.012em;

  white-space:nowrap;
}

.catch.play{
  animation:
    catchIn
    .55s
    ease;
}

@keyframes catchIn{

  from{
    opacity:0;

    transform:
      translateX(-18px);
  }

  to{
    opacity:1;

    transform:
      translateX(0);
  }

}


/* =========================
   RED LINE
========================= */

.red-line{
  width:
    calc(100vw - 22px);

  height:4px;

  margin-top:20px;

  transform-origin:
    left center;

  background:
    linear-gradient(
      90deg,
      #ed001d 0%,
      #ff1931 65%,
      transparent 100%
    );
}

.red-line.play{
  animation:
    redLineIn
    .75s
    cubic-bezier(.1,.8,.18,1);
}

@keyframes redLineIn{

  from{
    transform:
      scaleX(0);
  }

  to{
    transform:
      scaleX(1);
  }

}


/* =========================
   PC
========================= */

@media(min-width:768px){

  .header{
    height:98px;
    padding:0 42px;
  }

  .brand-logo{
    width:70px;
    height:70px;
  }

  .brand-name{
    font-size:40px;
  }

  .menu span{
    width:36px;
    height:4px;
  }

  .hero-copy{
    padding:
      48px
      0
      65px
      6vw;
  }

}

</style>

<script>

const movieB =
  document.getElementById("movieB");


const markLayer =

const mainTitle =
  document.getElementById("mainTitle");

let activeMovie =
  movieA;


let standbyMovie =
  movieB;


let playlist = [];


let lastMovie =
  null;


let switching =
  false;


/* =========================
   SHUFFLE
========================= */

function shuffleMovies(){

  playlist =
    [...movies];


  for(
    let i =
      playlist.length - 1;

    i > 0;

    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      playlist[i],
      playlist[j]

    ] = [

      playlist[j],
      playlist[i]

    ];

  }


  if(
    lastMovie &&
    playlist.length > 1 &&
    playlist[0] === lastMovie
  ){

    [
      playlist[0],
      playlist[1]

    ] = [

      playlist[1],
      playlist[0]

    ];

  }

}



/* =========================
   NEXT
========================= */

function getNextMovie(){

  if(
    playlist.length === 0
  ){

    shuffleMovies();

  }


  const next =
    playlist.shift();


  lastMovie =
    next;


  return next;

}
