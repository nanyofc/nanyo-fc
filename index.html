<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NANYO FOOTBALL CLUB</title>

<style>

/* =====================================
   RESET
===================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}


/* =====================================
   HEADER
===================================== */

.header{
  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b6001d 55%,
      #980018 100%
    );

  position:relative;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{
  width:56px;
  height:56px;
  object-fit:contain;
  display:block;
}

.brand-name{
  color:#fff;

  font-size:31px;
  line-height:1;

  font-weight:900;
  letter-spacing:.055em;

  white-space:nowrap;
}

.menu{
  width:48px;
  height:48px;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:7px;
}

.menu span{
  display:block;

  width:30px;
  height:3px;

  border-radius:3px;

  background:#d7b24a;
}


/* =====================================
   MOVIE AREA
===================================== */

.movie-wrap{
  position:relative;

  width:100%;
  aspect-ratio:16 / 9;

  overflow:hidden;

  background:#000;

  isolation:isolate;
}


/* =====================================
   MOVIE
===================================== */

.movie{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  background:#000;

  opacity:0;

  transform-origin:center center;

  filter:
    contrast(1.08)
    saturate(1.10);

  will-change:
    transform,
    filter,
    opacity;
}

.movie.active{
  opacity:1;
}


/*
   動画そのものを
   最初から最後まで動かす
*/

.movie.motion{
  animation:
    movieMotion
    var(--movie-duration, 8s)
    linear
    forwards;
}


@keyframes movieMotion{

  0%{
    transform:
      scale(1.30)
      rotate(-1deg);

    filter:
      blur(10px)
      contrast(1.9)
      saturate(1.6)
      brightness(1.25);
  }

  2%{
    transform:
      scale(1.22)
      translateX(-10px)
      rotate(.6deg);
  }

  4%{
    transform:
      scale(1.15)
      translateX(9px)
      rotate(-.4deg);

    filter:
      blur(3px)
      contrast(1.55)
      saturate(1.4)
      brightness(1.12);
  }

  7%{
    transform:
      scale(1.08)
      translateX(-4px)
      rotate(.2deg);
  }

  10%{
    transform:
      scale(1.035)
      translateX(0)
      rotate(0deg);

    filter:
      blur(0)
      contrast(1.10)
      saturate(1.10)
      brightness(1);
  }

  100%{
    transform:
      scale(1.10);

    filter:
      blur(0)
      contrast(1.13)
      saturate(1.14)
      brightness(.98);
  }

}


/* =====================================
   DARK HIT
===================================== */

.dark-hit{
  position:absolute;
  inset:0;

  z-index:15;

  background:#000;

  opacity:0;

  pointer-events:none;
}

.dark-hit.fire{
  animation:
    darkHit .38s ease;
}

@keyframes darkHit{

  0%{
    opacity:1;
  }

  30%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}


/* =====================================
   WHITE FLASH
===================================== */

.white-flash{
  position:absolute;
  inset:0;

  z-index:30;

  background:#fff;

  opacity:0;

  pointer-events:none;
}

.white-flash.fire{
  animation:
    whiteFlash .42s ease;
}

@keyframes whiteFlash{

  0%{
    opacity:0;
  }

  18%{
    opacity:1;
  }

  30%{
    opacity:.25;
  }

  47%{
    opacity:.8;
  }

  100%{
    opacity:0;
  }

}


/* =====================================
   RED FLASH
===================================== */

.red-flash{
  position:absolute;
  inset:0;

  z-index:24;

  background:#ee001e;

  mix-blend-mode:screen;

  opacity:0;

  pointer-events:none;
}

.red-flash.fire{
  animation:
    redFlash .55s ease;
}

@keyframes redFlash{

  0%{
    opacity:0;
  }

  24%{
    opacity:.7;
  }

  46%{
    opacity:.18;
  }

  100%{
    opacity:0;
  }

}


/* =====================================
   RED SLASH
===================================== */

.slash{
  position:absolute;

  z-index:28;

  top:-80%;
  left:-180%;

  width:210%;
  height:280%;

  transform:
    rotate(-19deg);

  opacity:0;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,

      transparent 0%,
      transparent 30%,

      rgba(255,0,30,.1) 36%,
      #ff002b 46%,
      #fff 49%,
      #ff002b 52%,
      rgba(255,0,30,.2) 61%,

      transparent 70%
    );
}

.slash.fire{
  animation:
    slashMove .58s
    cubic-bezier(.12,.78,.18,1);
}

@keyframes slashMove{

  0%{
    left:-180%;
    opacity:0;
  }

  10%{
    opacity:1;
  }

  100%{
    left:120%;
    opacity:0;
  }

}


/* =====================================
   SCREEN SHAKE
===================================== */

.movie-wrap.shake{
  animation:
    screenShake .48s linear;
}

@keyframes screenShake{

  0%{
    transform:translate(0,0);
  }

  10%{
    transform:translate(-7px,3px);
  }

  20%{
    transform:translate(8px,-4px);
  }

  30%{
    transform:translate(-6px,-2px);
  }

  40%{
    transform:translate(7px,3px);
  }

  50%{
    transform:translate(-4px,-2px);
  }

  65%{
    transform:translate(4px,2px);
  }

  80%{
    transform:translate(-2px,0);
  }

  100%{
    transform:translate(0,0);
  }

}


/* =====================================
   SCAN EFFECT
===================================== */

.scan{
  position:absolute;
  inset:0;

  z-index:10;

  pointer-events:none;

  opacity:.12;

  background:
    repeating-linear-gradient(
      to bottom,

      rgba(255,255,255,.10) 0px,
      rgba(255,255,255,.10) 1px,

      transparent 1px,
      transparent 4px
    );
}


/* =====================================
   RED SWEEP
===================================== */

.red-sweep{
  position:absolute;

  z-index:20;

  top:0;
  left:-100%;

  width:100%;
  height:100%;

  opacity:0;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,

      transparent 0%,
      rgba(255,0,30,.05) 20%,
      rgba(255,0,30,.50) 48%,
      rgba(255,0,30,.08) 70%,
      transparent 100%
    );
}

.red-sweep.fire{
  animation:
    redSweep .72s ease-out;
}

@keyframes redSweep{

  0%{
    left:-110%;
    opacity:0;
  }

  15%{
    opacity:1;
  }

  100%{
    left:110%;
    opacity:0;
  }

}


/* =====================================
   TEXT AREA
===================================== */

.hero-copy{
  width:100%;

  overflow:hidden;

  padding:
    31px
    0
    46px
    22px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(140,0,15,.18),
      transparent 43%
    ),
    #000;
}


/* =====================================
   MAIN TITLE
===================================== */

.main-title{
  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;
}

.main-title.play{
  animation:
    titleHit .7s
    cubic-bezier(.08,.82,.2,1);
}

@keyframes titleHit{

  0%{
    opacity:0;

    transform:
      translateX(-55px)
      scale(1.25)
      skewX(-14deg);

    filter:
      blur(9px);
  }

  42%{
    opacity:1;

    transform:
      translateX(10px)
      scale(1.04)
      skewX(4deg);

    filter:
      blur(1px);
  }

  62%{
    transform:
      translateX(-5px)
      skewX(-2deg);
  }

  100%{
    opacity:1;

    transform:
      translateX(0)
      scale(1)
      skewX(0);

    filter:
      blur(0);
  }

}


/* =====================================
   COUNTERATTACK
===================================== */

.catch{
  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;
  font-style:italic;

  letter-spacing:.012em;

  white-space:nowrap;
}

.catch.play{
  animation:
    catchHit .75s steps(1);
}

@keyframes catchHit{

  0%{
    opacity:0;
    transform:translateX(-35px);
  }

  14%{
    opacity:1;

    transform:translateX(8px);

    text-shadow:
      -7px 0 #00eaff,
      7px 0 #ff003c;
  }

  27%{
    transform:translateX(-6px);

    text-shadow:
      6px 0 #00eaff,
      -6px 0 #ff003c;
  }

  42%{
    transform:translateX(4px);

    text-shadow:
      -3px 0 #00eaff,
      3px 0 #ff003c;
  }

  58%{
    transform:translateX(-2px);
    text-shadow:none;
  }

  74%{
    transform:translateX(2px);

    text-shadow:
      2px 0 #00eaff,
      -2px 0 #ff003c;
  }

  100%{
    opacity:1;
    transform:translateX(0);
    text-shadow:none;
  }

}


/* =====================================
   RED LINE
===================================== */

.red-line{
  position:relative;

  width:
    calc(100vw - 22px);

  height:4px;

  margin-top:20px;

  transform-origin:left center;

  background:
    linear-gradient(
      90deg,
      #ed001d 0%,
      #ff1931 65%,
      transparent 100%
    );
}

.red-line.play{
  animation:
    beam .72s
    cubic-bezier(.1,.8,.18,1);
}

@keyframes beam{

  0%{
    transform:scaleX(0);
    filter:brightness(4);
  }

  65%{
    transform:scaleX(1.08);
    filter:brightness(2);
  }

  100%{
    transform:scaleX(1);
    filter:brightness(1);
  }

}


/* =====================================
   PC
===================================== */

@media(min-width:768px){

  .header{
    height:98px;
    padding:0 42px;
  }

  .brand-logo{
    width:70px;
    height:70px;
  }

  .brand-name{
    font-size:40px;
  }

  .menu span{
    width:36px;
    height:4px;
  }

  .hero-copy{
    padding:
      48px
      0
      65px
      6vw;
  }

}

</style>
</head>


<body>


<!-- HEADER -->

<header class="header">

  <div class="brand">

    <img
      src="nf1.png"
      alt="NANYO FC"
      class="brand-logo"
    >

    <div class="brand-name">
      NANYO FC
    </div>

  </div>


  <div class="menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

</header>



<!-- MOVIE -->

<section
  id="movieWrap"
  class="movie-wrap"
>

  <video
    id="movieA"
    class="movie active"
    muted
    playsinline
    preload="auto">
  </video>


  <video
    id="movieB"
    class="movie"
    muted
    playsinline
    preload="metadata">
  </video>


  <div class="scan"></div>

  <div
    id="darkHit"
    class="dark-hit">
  </div>

  <div
    id="redSweep"
    class="red-sweep">
  </div>

  <div
    id="redFlash"
    class="red-flash">
  </div>

  <div
    id="slash"
    class="slash">
  </div>

  <div
    id="whiteFlash"
    class="white-flash">
  </div>

</section>



<!-- TEXT -->

<section class="hero-copy">

  <h1
    id="mainTitle"
    class="main-title">

    NANYO<br>
    FOOTBALL CLUB

  </h1>


  <div
    id="catchText"
    class="catch">

    COUNTERATTACK BEGINS

  </div>


  <div
    id="redLine"
    class="red-line">
  </div>

</section>



<script>

/* =====================================
   MOVIES
===================================== */

const movies = [
  "movie/nf1.mp4",
  "movie/nf2.mp4",
  "movie/nf3.mp4",
  "movie/nf4.mp4",
  "movie/nf5.mp4",
  "movie/nf6.mp4"
];


const movieWrap =
  document.getElementById("movieWrap");

const movieA =
  document.getElementById("movieA");

const movieB =
  document.getElementById("movieB");

const darkHit =
  document.getElementById("darkHit");

const redSweep =
  document.getElementById("redSweep");

const redFlash =
  document.getElementById("redFlash");

const slash =
  document.getElementById("slash");

const whiteFlash =
  document.getElementById("whiteFlash");

const mainTitle =
  document.getElementById("mainTitle");

const catchText =
  document.getElementById("catchText");

const redLine =
  document.getElementById("redLine");


let activeMovie = movieA;
let standbyMovie = movieB;

let playlist = [];
let previousMovie = null;
let switching = false;


/* =====================================
   RANDOM PLAYLIST
===================================== */

function shuffleMovies(){

  playlist = [...movies];

  for(
    let i = playlist.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      playlist[i],
      playlist[j]
    ] = [
      playlist[j],
      playlist[i]
    ];
  }


  if(
    previousMovie &&
    playlist.length > 1 &&
    playlist[0] === previousMovie
  ){

    [
      playlist[0],
      playlist[1]
    ] = [
      playlist[1],
      playlist[0]
    ];
  }
}


function getNextMovie(){

  if(playlist.length === 0){
    shuffleMovies();
  }

  const movie = playlist.shift();

  previousMovie = movie;

  return movie;
}


/* =====================================
   CLASS RESTART
===================================== */

function restart(
  element,
  className
){

  element.classList.remove(className);

  void element.offsetWidth;

  element.classList.add(className);
}


/* =====================================
   VIDEO MOTION
===================================== */

function startMovieMotion(video){

  video.classList.remove("motion");

  void video.offsetWidth;

  video.classList.add("motion");
}


/* =====================================
   IMPACT FX
===================================== */

function impact(){

  movieWrap.classList.remove("shake");

  void movieWrap.offsetWidth;

  movieWrap.classList.add("shake");


  restart(
    darkHit,
    "fire"
  );


  setTimeout(() => {

    restart(
      redSweep,
      "fire"
    );

  }, 40);


  setTimeout(() => {

    restart(
      redFlash,
      "fire"
    );

  }, 70);


  setTimeout(() => {

    restart(
      slash,
      "fire"
    );

  }, 90);


  setTimeout(() => {

    restart(
      whiteFlash,
      "fire"
    );

  }, 145);

}


/* =====================================
   TEXT FX
===================================== */

function textImpact(){

  restart(
    mainTitle,
    "play"
  );


  setTimeout(() => {

    restart(
      catchText,
      "play"
    );

  }, 120);


  setTimeout(() => {

    restart(
      redLine,
      "play"
    );

  }, 260);

}


/* =====================================
   PREPARE
===================================== */

function prepareNext(){

  standbyMovie.src =
    getNextMovie();

  standbyMovie.load();
}


/* =====================================
   SWITCH
===================================== */

function switchMovie(){

  if(switching){
    return;
  }

  switching = true;


  impact();


  setTimeout(() => {

    standbyMovie.currentTime = 0;


    standbyMovie.play()

      .then(() => {

        standbyMovie
          .classList
          .add("active");


        activeMovie
          .classList
          .remove("active");


        startMovieMotion(
          standbyMovie
        );


        textImpact();


        setTimeout(() => {

          activeMovie.pause();

          activeMovie
            .classList
            .remove("motion");


          const old =
            activeMovie;


          activeMovie =
            standbyMovie;


          standbyMovie =
            old;


          prepareNext();


          switching =
            false;

        }, 500);

      })

      .catch(() => {

        switching =
          false;

      });

  }, 170);

}


/* =====================================
   START
===================================== */

function start(){

  shuffleMovies();


  activeMovie.src =
    getNextMovie();


  activeMovie.load();


  activeMovie.addEventListener(
    "loadedmetadata",
    () => {

      activeMovie.style.setProperty(
        "--movie-duration",
        activeMovie.duration + "s"
      );

    },
    { once:true }
  );


  activeMovie.play()
    .catch(() => {});


  prepareNext();


  setTimeout(() => {

    impact();

    startMovieMotion(
      activeMovie
    );

    textImpact();

  }, 250);

}


/* 動画ごとの長さをCSSへ */

movieA.addEventListener(
  "loadedmetadata",
  () => {

    movieA.style.setProperty(
      "--movie-duration",
      movieA.duration + "s"
    );

  }
);


movieB.addEventListener(
  "loadedmetadata",
  () => {

    movieB.style.setProperty(
      "--movie-duration",
      movieB.duration + "s"
    );

  }
);


/* END */

movieA.addEventListener(
  "ended",
  switchMovie
);

movieB.addEventListener(
  "ended",
  switchMovie
);


start();

</script>


</body>
</html>
