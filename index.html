<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NANYO FOOTBALL CLUB</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .hero {
      width: 100%;
      min-height: 100svh;
      background: #000;
      color: #fff;
    }

    /* =====================
       VIDEO AREA
    ===================== */

    .video-area {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #000;
    }

    .hero-video {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;
      transition: opacity 0.65s ease;
    }

    .hero-video.active {
      opacity: 1;
    }

    /* 少し暗くする */
    .video-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.22),
          rgba(0,0,0,0.02) 55%,
          rgba(0,0,0,0.28)
        );

      pointer-events: none;
    }

    /* =====================
       HEADER
    ===================== */

    .header {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding:
        calc(20px + env(safe-area-inset-top))
        24px
        20px;

      z-index: 5;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.28em;
      color: #fff;

      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .menu {
      width: 44px;
      height: 44px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 7px;
    }

    .menu span {
      width: 28px;
      height: 2px;
      background: #fff;

      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* =====================
       TEXT AREA
    ===================== */

    .copy-area {
      position: relative;

      min-height: calc(100svh - 56.25vw);

      padding:
        60px
        24px
        calc(35px + env(safe-area-inset-bottom));

      display: flex;
      flex-direction: column;
      justify-content: center;

      background: #000;
    }

    .club-name {
      font-size: clamp(42px, 11vw, 78px);
      line-height: 0.88;
      font-weight: 900;
      letter-spacing: -0.055em;

      opacity: 0;
      transform: translateY(28px);

      animation: titleIn 0.9s ease forwards;
      animation-delay: 0.25s;
    }

    .catch {
      margin-top: 24px;

      color: #ed1717;

      font-size: clamp(19px, 5.3vw, 35px);
      font-weight: 900;
      font-style: italic;

      line-height: 1;
      letter-spacing: 0.025em;

      white-space: nowrap;

      opacity: 0;
      transform: translateX(-22px);

      animation: catchIn 0.8s ease forwards;
      animation-delay: 0.75s;
    }

    .red-line {
      margin-top: 21px;

      width: 0;
      height: 3px;

      background: #ed1717;

      animation: lineIn 1s ease forwards;
      animation-delay: 1.05s;
    }

    .scroll {
      position: absolute;

      right: 25px;
      bottom: 26px;

      font-size: 9px;
      letter-spacing: 0.3em;

      color: rgba(255,255,255,0.65);
    }

    .scroll::after {
      content: "";

      display: inline-block;

      width: 1px;
      height: 28px;

      margin-left: 10px;

      vertical-align: middle;

      background: rgba(255,255,255,0.65);

      animation: scrollLine 1.5s ease-in-out infinite;
    }

    /* =====================
       ANIMATION
    ===================== */

    @keyframes titleIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes catchIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes lineIn {
      to {
        width: 150px;
      }
    }

    @keyframes scrollLine {
      0%, 100% {
        opacity: 0.25;
        transform: scaleY(0.35);
      }

      50% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    /* =====================
       PC
    ===================== */

    @media (min-width: 768px) {

      .hero {
        position: relative;
        min-height: 100vh;
      }

      .video-area {
        height: 100vh;
        aspect-ratio: auto;
      }

      .hero-video {
        object-fit: cover;
      }

      .copy-area {
        position: absolute;

        left: 0;
        bottom: 0;

        z-index: 5;

        width: 100%;
        min-height: auto;

        padding:
          0
          6vw
          9vh;

        background:
          linear-gradient(
            to top,
            rgba(0,0,0,0.92),
            rgba(0,0,0,0)
          );

        pointer-events: none;
      }

      .club-name {
        font-size: clamp(70px, 7vw, 120px);
      }

      .catch {
        font-size: clamp(28px, 3vw, 52px);
      }

      .header {
        padding: 32px 50px;
      }

      .logo-text {
        font-size: 18px;
      }

    }

  </style>
</head>


<body>

<section class="hero">

  <div class="video-area">

    <video
      id="videoA"
      class="hero-video active"
      muted
      playsinline
      preload="auto">
    </video>

    <video
      id="videoB"
      class="hero-video"
      muted
      playsinline
      preload="metadata">
    </video>

    <div class="video-overlay"></div>


    <header class="header">

      <div class="logo-text">
        NANYO FC
      </div>

      <div class="menu">
        <span></span>
        <span></span>
      </div>

    </header>

  </div>


  <div class="copy-area">

    <h1 class="club-name">
      NANYO<br>
      FOOTBALL CLUB
    </h1>

    <div class="catch">
      COUNTERATTACK BEGINS
    </div>

    <div class="red-line"></div>

    <div class="scroll">
      SCROLL
    </div>

  </div>

</section>


<script>

const movies = [
  "movie/nf1.mp4",
  "movie/nf2.mp4",
  "movie/nf3.mp4",
  "movie/nf4.mp4",
  "movie/nf5.mp4",
  "movie/nf6.mp4"
];

const videoA = document.getElementById("videoA");
const videoB = document.getElementById("videoB");

let activeVideo = videoA;
let standbyVideo = videoB;

let playlist = [];
let lastMovie = null;


/* ランダム順を作る */
function shuffleMovies() {

  playlist = [...movies];

  for (let i = playlist.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [playlist[i], playlist[j]] =
    [playlist[j], playlist[i]];
  }

  /* 前回最後と次回最初が同じになるのを防ぐ */
  if (
    lastMovie &&
    playlist.length > 1 &&
    playlist[0] === lastMovie
  ) {

    [playlist[0], playlist[1]] =
    [playlist[1], playlist[0]];
  }
}


/* 次の動画 */
function getNextMovie() {

  if (playlist.length === 0) {
    shuffleMovies();
  }

  const movie = playlist.shift();

  lastMovie = movie;

  return movie;
}


/* 次動画を準備 */
function prepareNextVideo() {

  standbyVideo.src = getNextMovie();
  standbyVideo.load();
}


/* 動画切替 */
function switchVideo() {

  standbyVideo.currentTime = 0;

  standbyVideo.play()
    .then(() => {

      standbyVideo.classList.add("active");
      activeVideo.classList.remove("active");

      setTimeout(() => {

        activeVideo.pause();

        const oldVideo = activeVideo;

        activeVideo = standbyVideo;
        standbyVideo = oldVideo;

        prepareNextVideo();

      }, 700);

    })
    .catch(() => {});
}


/* 最初の動画 */
function startVideos() {

  shuffleMovies();

  activeVideo.src = getNextMovie();

  activeVideo.load();

  activeVideo.play().catch(() => {});

  prepareNextVideo();
}


videoA.addEventListener("ended", switchVideo);
videoB.addEventListener("ended", switchVideo);

startVideos();

</script>

</body>
</html>
