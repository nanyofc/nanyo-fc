<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NANYO FOOTBALL CLUB</title>

<style>

/* =====================================
   RESET
===================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}


/* =====================================
   HEADER
===================================== */

.header{
  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b6001d 55%,
      #980018 100%
    );

  position:relative;
  z-index:50;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{
  width:56px;
  height:56px;
  object-fit:contain;
  display:block;
}

.brand-name{
  color:#fff;
  font-size:31px;
  line-height:1;
  font-weight:900;
  letter-spacing:.055em;
  white-space:nowrap;
}

.menu{
  width:48px;
  height:48px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  gap:7px;
}

.menu span{
  display:block;

  width:30px;
  height:3px;

  border-radius:3px;

  background:#d7b24a;
}


/* =====================================
   MOVIE
===================================== */

.movie-wrap{
  position:relative;

  width:100%;
  aspect-ratio:16 / 9;

  overflow:hidden;

  background:#000;

  isolation:isolate;
}

.movie{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  background:#000;

  opacity:0;

  transform-origin:center center;

  filter:
    contrast(1.07)
    saturate(1.08);

  will-change:
    transform,
    opacity,
    filter;
}

.movie.active{
  opacity:1;
}

.movie.motion{
  animation:
    movieMotion
    var(--movie-duration, 8s)
    linear
    forwards;
}


/* 動画自体も少しだけPV感 */

@keyframes movieMotion{

  0%{
    transform:scale(1.08);
    filter:
      contrast(1.25)
      saturate(1.20)
      brightness(1.06);
  }

  8%{
    transform:scale(1.025);
  }

  100%{
    transform:scale(1.07);
    filter:
      contrast(1.10)
      saturate(1.12)
      brightness(.98);
  }

}


/* =====================================
   MOVIE SHADE
===================================== */

.movie-shade{
  position:absolute;
  inset:0;

  z-index:5;

  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.08) 0%,
      transparent 28%,
      transparent 70%,
      rgba(0,0,0,.17) 100%
    );
}


/* =====================================
   CORNER FRAME
===================================== */

.corner{
  position:absolute;

  width:30px;
  height:30px;

  z-index:12;

  pointer-events:none;

  opacity:.9;
}


/* 左上 */

.corner.tl{
  top:12px;
  left:12px;

  border-top:2px solid rgba(255,255,255,.85);
  border-left:2px solid #e60020;
}


/* 右上 */

.corner.tr{
  top:12px;
  right:12px;

  border-top:2px solid rgba(255,255,255,.85);
  border-right:2px solid #e60020;
}


/* 左下 */

.corner.bl{
  bottom:13px;
  left:12px;

  border-bottom:2px solid rgba(255,255,255,.85);
  border-left:2px solid #e60020;
}


/* 右下 */

.corner.br{
  bottom:13px;
  right:12px;

  border-bottom:2px solid rgba(255,255,255,.85);
  border-right:2px solid #e60020;
}


/* =====================================
   SCAN LINES
===================================== */

.scanlines{
  position:absolute;
  inset:0;

  z-index:8;

  pointer-events:none;

  opacity:.09;

  background:
    repeating-linear-gradient(
      to bottom,

      rgba(255,255,255,.11) 0px,
      rgba(255,255,255,.11) 1px,

      transparent 1px,
      transparent 4px
    );
}


/* =====================================
   NOISE
===================================== */

.noise{
  position:absolute;
  inset:0;

  z-index:9;

  pointer-events:none;

  opacity:.07;

  background-image:
    radial-gradient(
      rgba(255,255,255,.65) .45px,
      transparent .45px
    );

  background-size:4px 4px;

  animation:
    noiseMove .28s steps(2) infinite;
}

@keyframes noiseMove{

  0%{
    transform:translate(0,0);
  }

  25%{
    transform:translate(-1px,1px);
  }

  50%{
    transform:translate(1px,-1px);
  }

  75%{
    transform:translate(1px,1px);
  }

  100%{
    transform:translate(0,0);
  }

}


/* =====================================
   RED SWEEP LINE
===================================== */

.sweep-line{
  position:absolute;

  left:-45%;
  top:38%;

  width:45%;
  height:2px;

  z-index:15;

  opacity:0;

  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,0,30,.35),
      #ff1832,
      #fff,
      #ff1832,
      transparent
    );

  box-shadow:
    0 0 10px rgba(255,0,30,.8);
}

.sweep-line.fire{
  animation:
    sweepLine .55s
    cubic-bezier(.12,.78,.18,1);
}

@keyframes sweepLine{

  0%{
    left:-50%;
    opacity:0;
  }

  12%{
    opacity:1;
  }

  100%{
    left:110%;
    opacity:0;
  }

}


/* =====================================
   FLASH
===================================== */

.white-flash{
  position:absolute;
  inset:0;

  z-index:25;

  background:#fff;

  opacity:0;

  pointer-events:none;
}

.white-flash.fire{
  animation:
    flashFx .28s ease;
}

@keyframes flashFx{

  0%{
    opacity:0;
  }

  28%{
    opacity:.75;
  }

  100%{
    opacity:0;
  }

}


/* =====================================
   PROGRESS
===================================== */

.progress-track{
  position:absolute;

  left:0;
  bottom:0;

  width:100%;
  height:4px;

  z-index:20;

  background:
    rgba(255,255,255,.12);

  overflow:hidden;
}

.progress-bar{
  width:100%;
  height:100%;

  transform:scaleX(0);
  transform-origin:left center;

  background:
    linear-gradient(
      90deg,
      #b60018,
      #ff1731,
      #ff4254
    );

  box-shadow:
    0 0 10px
    rgba(255,0,30,.75);
}

.progress-bar.play{
  animation:
    progressMovie
    var(--progress-duration, 8s)
    linear
    forwards;
}

@keyframes progressMovie{

  from{
    transform:scaleX(0);
  }

  to{
    transform:scaleX(1);
  }

}


/* =====================================
   COPY
===================================== */

.hero-copy{
  width:100%;

  overflow:hidden;

  padding:
    31px
    0
    46px
    22px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(140,0,15,.18),
      transparent 43%
    ),
    #000;
}


/* =====================================
   MAIN TITLE
===================================== */

.main-title{
  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;
}

.main-title.play{
  animation:
    titleHit .72s
    cubic-bezier(.08,.82,.2,1);
}

@keyframes titleHit{

  0%{
    opacity:0;

    transform:
      translateX(-45px)
      scale(1.15);

    filter:blur(7px);
  }

  50%{
    opacity:1;

    transform:
      translateX(6px)
      scale(1.02);

    filter:blur(1px);
  }

  100%{
    opacity:1;

    transform:
      translateX(0)
      scale(1);

    filter:blur(0);
  }

}


/* =====================================
   COUNTERATTACK
===================================== */

.catch{
  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;
  font-style:italic;

  letter-spacing:.012em;

  white-space:nowrap;
}

.catch.play{
  animation:
    catchHit .62s ease;
}

@keyframes catchHit{

  0%{
    opacity:0;
    transform:translateX(-25px);
    filter:blur(6px);
  }

  55%{
    opacity:1;
    transform:translateX(4px);
    filter:blur(1px);
  }

  100%{
    opacity:1;
    transform:translateX(0);
    filter:blur(0);
  }

}


/* =====================================
   RED LINE UNDER TEXT
===================================== */

.red-line{
  position:relative;

  width:
    calc(100vw - 22px);

  height:4px;

  margin-top:20px;

  transform-origin:left center;

  background:
    linear-gradient(
      90deg,
      #ed001d 0%,
      #ff1931 65%,
      transparent 100%
    );
}

.red-line.play{
  animation:
    beam .75s
    cubic-bezier(.1,.8,.18,1);
}

@keyframes beam{

  0%{
    transform:scaleX(0);
    filter:brightness(3);
  }

  100%{
    transform:scaleX(1);
    filter:brightness(1);
  }

}


/* =====================================
   PC
===================================== */

@media(min-width:768px){

  .header{
    height:98px;
    padding:0 42px;
  }

  .brand-logo{
    width:70px;
    height:70px;
  }

  .brand-name{
    font-size:40px;
  }

  .menu span{
    width:36px;
    height:4px;
  }

  .hero-copy{
    padding:
      48px
      0
      65px
      6vw;
  }

}

</style>
</head>


<body>


<!-- HEADER -->

<header class="header">

  <div class="brand">

    <img
      src="nf1.png"
      alt="NANYO FC"
      class="brand-logo"
    >

    <div class="brand-name">
      NANYO FC
    </div>

  </div>


  <div class="menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

</header>



<!-- MOVIE -->

<section
  id="movieWrap"
  class="movie-wrap"
>

  <video
    id="movieA"
    class="movie active"
    muted
    playsinline
    preload="auto">
  </video>

  <video
    id="movieB"
    class="movie"
    muted
    playsinline
    preload="metadata">
  </video>


  <div class="movie-shade"></div>

  <div class="scanlines"></div>

  <div class="noise"></div>


  <!-- 四隅 -->

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>


  <!-- 高速横断ライン -->

  <div
    id="sweepLine"
    class="sweep-line">
  </div>


  <!-- 切替フラッシュ -->

  <div
    id="whiteFlash"
    class="white-flash">
  </div>


  <!-- 進行ライン -->

  <div class="progress-track">

    <div
      id="progressBar"
      class="progress-bar">
    </div>

  </div>

</section>



<!-- TEXT -->

<section class="hero-copy">

  <h1
    id="mainTitle"
    class="main-title">

    NANYO<br>
    FOOTBALL CLUB

  </h1>


  <div
    id="catchText"
    class="catch">

    COUNTERATTACK BEGINS

  </div>


  <div
    id="redLine"
    class="red-line">
  </div>

</section>



<script>


/* =====================================
   MOVIES
===================================== */

const movies = [
  "movie/nf1.mp4",
  "movie/nf2.mp4",
  "movie/nf3.mp4",
  "movie/nf4.mp4",
  "movie/nf5.mp4",
  "movie/nf6.mp4"
];


const movieA =
  document.getElementById("movieA");

const movieB =
  document.getElementById("movieB");

const sweepLine =
  document.getElementById("sweepLine");

const whiteFlash =
  document.getElementById("whiteFlash");

const progressBar =
  document.getElementById("progressBar");

const mainTitle =
  document.getElementById("mainTitle");

const catchText =
  document.getElementById("catchText");

const redLine =
  document.getElementById("redLine");


let activeMovie =
  movieA;

let standbyMovie =
  movieB;

let playlist = [];

let lastMovie =
  null;

let switching =
  false;

let sweepTimer =
  null;


/* =====================================
   SHUFFLE
===================================== */

function shuffleMovies(){

  playlist = [...movies];

  for(
    let i = playlist.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      playlist[i],
      playlist[j]
    ] = [
      playlist[j],
      playlist[i]
    ];

  }


  if(
    lastMovie &&
    playlist.length > 1 &&
    playlist[0] === lastMovie
  ){

    [
      playlist[0],
      playlist[1]
    ] = [
      playlist[1],
      playlist[0]
    ];

  }

}


function getNextMovie(){

  if(playlist.length === 0){
    shuffleMovies();
  }

  const next =
    playlist.shift();

  lastMovie =
    next;

  return next;

}


/* =====================================
   RESTART CLASS
===================================== */

function restart(
  element,
  className
){

  element
    .classList
    .remove(className);

  void element.offsetWidth;

  element
    .classList
    .add(className);

}


/* =====================================
   TEXT
===================================== */

function replayText(){

  restart(
    mainTitle,
    "play"
  );

  setTimeout(() => {

    restart(
      catchText,
      "play"
    );

  },120);


  setTimeout(() => {

    restart(
      redLine,
      "play"
    );

  },240);

}


/* =====================================
   MOVIE MOTION
===================================== */

function startMovieMotion(video){

  video
    .classList
    .remove("motion");

  void video.offsetWidth;

  video
    .classList
    .add("motion");

}


/* =====================================
   PROGRESS
===================================== */

function startProgress(duration){

  progressBar
    .classList
    .remove("play");

  progressBar
    .style
    .setProperty(
      "--progress-duration",
      duration + "s"
    );

  void progressBar.offsetWidth;

  progressBar
    .classList
    .add("play");

}


/* =====================================
   SWEEP LINE
===================================== */

function fireSweep(){

  restart(
    sweepLine,
    "fire"
  );

}


function startSweepLoop(){

  clearInterval(
    sweepTimer
  );

  fireSweep();

  sweepTimer =
    setInterval(
      fireSweep,
      2600
    );

}


/* =====================================
   PREPARE
===================================== */

function prepareNext(){

  standbyMovie.src =
    getNextMovie();

  standbyMovie.load();

}


/* =====================================
   SWITCH
===================================== */

function switchMovie(){

  if(switching){
    return;
  }

  switching =
    true;


  restart(
    whiteFlash,
    "fire"
  );


  setTimeout(() => {

    standbyMovie.currentTime =
      0;


    standbyMovie.play()

      .then(() => {

        standbyMovie
          .classList
          .add("active");


        activeMovie
          .classList
          .remove("active");


        startMovieMotion(
          standbyMovie
        );


        const duration =
          standbyMovie.duration || 8;


        startProgress(
          duration
        );


        replayText();

        startSweepLoop();


        setTimeout(() => {

          activeMovie.pause();

          activeMovie
            .classList
            .remove("motion");


          const oldMovie =
            activeMovie;


          activeMovie =
            standbyMovie;


          standbyMovie =
            oldMovie;


          prepareNext();


          switching =
            false;

        },450);

      })

      .catch(() => {

        switching =
          false;

      });

  },100);

}


/* =====================================
   METADATA
===================================== */

movieA.addEventListener(
  "loadedmetadata",
  () => {

    movieA.style
      .setProperty(
        "--movie-duration",
        movieA.duration + "s"
      );

  }
);


movieB.addEventListener(
  "loadedmetadata",
  () => {

    movieB.style
      .setProperty(
        "--movie-duration",
        movieB.duration + "s"
      );

  }
);


/* =====================================
   START
===================================== */

function start(){

  shuffleMovies();


  activeMovie.src =
    getNextMovie();


  activeMovie.load();


  activeMovie
    .addEventListener(
      "loadedmetadata",
      () => {

        const duration =
          activeMovie.duration || 8;


        activeMovie.style
          .setProperty(
            "--movie-duration",
            duration + "s"
          );


        startProgress(
          duration
        );


        startMovieMotion(
          activeMovie
        );


        startSweepLoop();


        replayText();

      },
      { once:true }
    );


  activeMovie
    .play()
    .catch(() => {});


  prepareNext();

}


/* =====================================
   END
===================================== */

movieA.addEventListener(
  "ended",
  switchMovie
);

movieB.addEventListener(
  "ended",
  switchMovie
);


start();

</script>


</body>
</html>
