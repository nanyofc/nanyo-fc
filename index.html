<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NANYO FOOTBALL CLUB</title>

<style>

/* ======================================
   RESET
====================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}


/* ======================================
   HEADER
====================================== */

.header{

  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b6001d 55%,
      #980018 100%
    );

  position:relative;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{

  width:56px;
  height:56px;

  object-fit:contain;
  display:block;
}

.brand-name{

  color:#fff;

  font-size:31px;
  line-height:1;

  font-weight:900;
  letter-spacing:.055em;

  white-space:nowrap;
}

.menu{

  width:48px;
  height:48px;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  gap:7px;
}

.menu span{

  display:block;

  width:30px;
  height:3px;

  border-radius:3px;

  background:#d7b24a;
}


/* ======================================
   MOVIE
====================================== */

.movie-wrap{

  position:relative;

  width:100%;
  aspect-ratio:16 / 9;

  overflow:hidden;

  background:#000;

  --cut-time:460ms;
}

.movie{

  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  display:block;

  background:#000;

  opacity:0;

  z-index:1;
}

.movie.active{
  opacity:1;
}


/* ======================================
   CUT BLACK
====================================== */

.cut-black{

  position:absolute;
  inset:0;

  z-index:10;

  background:#000;

  opacity:0;

  pointer-events:none;
}


/*
  毎回同じ時間で暗転
*/

.cut-black.play{

  animation:
    blackCut
    var(--cut-time)
    linear
    forwards;
}


@keyframes blackCut{

  0%{
    opacity:0;
  }

  38%{
    opacity:1;
  }

  62%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}


/* ======================================
   COPY
====================================== */

.hero-copy{

  width:100%;

  overflow:hidden;

  padding:
    31px
    0
    46px
    22px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(140,0,15,.18),
      transparent 43%
    ),
    #000;
}


/* ======================================
   TITLE
====================================== */

.main-title{

  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;
}


/*
  毎回動画切替で動く
*/

.main-title.play{

  animation:
    titleMove
    .75s
    cubic-bezier(.15,.80,.20,1);
}


@keyframes titleMove{

  0%{

    opacity:0;

    transform:
      translateX(-35px);

    filter:
      blur(4px);
  }

  100%{

    opacity:1;

    transform:
      translateX(0);

    filter:
      blur(0);
  }

}


/* ======================================
   CATCH
====================================== */

.catch{

  margin-top:22px;

  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;
  font-style:italic;

  white-space:nowrap;
}


.catch.play{

  animation:
    catchMove
    .65s
    cubic-bezier(.15,.80,.20,1);
}


@keyframes catchMove{

  0%{

    opacity:0;

    transform:
      translateX(28px);
  }

  100%{

    opacity:1;

    transform:
      translateX(0);
  }

}


/* ======================================
   RED LINE
====================================== */

.red-line{

  width:
    calc(100vw - 22px);

  height:4px;

  margin-top:20px;

  transform-origin:left center;

  background:
    linear-gradient(
      90deg,
      #ed001d 0%,
      #ff1931 65%,
      transparent 100%
    );
}


.red-line.play{

  animation:
    lineMove
    .85s
    cubic-bezier(.1,.8,.18,1);
}


@keyframes lineMove{

  0%{
    transform:scaleX(0);
    opacity:0;
  }

  100%{
    transform:scaleX(1);
    opacity:1;
  }

}


/* ======================================
   PC
====================================== */

@media(min-width:768px){

  .header{
    height:98px;
    padding:0 42px;
  }

  .brand-logo{
    width:70px;
    height:70px;
  }

  .brand-name{
    font-size:40px;
  }

  .menu span{
    width:36px;
    height:4px;
  }

  .hero-copy{

    padding:
      48px
      0
      65px
      6vw;
  }

}

</style>

</head>


<body>


<!-- ======================================
     HEADER
====================================== -->

<header class="header">

  <div class="brand">

    <img
      src="nf1.png"
      alt="NANYO FC"
      class="brand-logo"
    >

    <div class="brand-name">
      NANYO FC
    </div>

  </div>


  <div class="menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

</header>



<!-- ======================================
     MOVIE
====================================== -->

<section class="movie-wrap">

  <video
    id="movieA"
    class="movie active"
    muted
    playsinline
    webkit-playsinline
    preload="auto">
  </video>


  <video
    id="movieB"
    class="movie"
    muted
    playsinline
    webkit-playsinline
    preload="auto">
  </video>


  <div
    id="cutBlack"
    class="cut-black">
  </div>

</section>



<!-- ======================================
     COPY
====================================== -->

<section class="hero-copy">

  <h1
    id="mainTitle"
    class="main-title">

    NANYO<br>
    FOOTBALL CLUB

  </h1>


  <div
    id="catchText"
    class="catch">

    COUNTERATTACK BEGINS

  </div>


  <div
    id="redLine"
    class="red-line">
  </div>

</section>



<script>


/* ======================================
   MOVIES
====================================== */

const movies = [

  "movie/nf1.mp4",
  "movie/nf2.mp4",
  "movie/nf3.mp4",
  "movie/nf4.mp4",
  "movie/nf5.mp4",
  "movie/nf6.mp4"

];


const movieA =
  document.getElementById("movieA");

const movieB =
  document.getElementById("movieB");

const cutBlack =
  document.getElementById("cutBlack");

const mainTitle =
  document.getElementById("mainTitle");

const catchText =
  document.getElementById("catchText");

const redLine =
  document.getElementById("redLine");


let activeVideo = movieA;
let standbyVideo = movieB;

let playlist = [];

let lastMovie = null;

let switching = false;


/* ======================================
   SHUFFLE
====================================== */

function shuffleMovies(){

  playlist = [...movies];


  for(
    let i = playlist.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      playlist[i],
      playlist[j]

    ] = [

      playlist[j],
      playlist[i]

    ];

  }


  /*
    一巡した境目で
    同じ動画が連続しない
  */

  if(
    lastMovie &&
    playlist.length > 1 &&
    playlist[0] === lastMovie
  ){

    [
      playlist[0],
      playlist[1]

    ] = [

      playlist[1],
      playlist[0]

    ];

  }

}


/* ======================================
   NEXT
====================================== */

function getNextMovie(){

  if(playlist.length === 0){
    shuffleMovies();
  }


  const next =
    playlist.shift();


  lastMovie =
    next;


  return next;

}


/* ======================================
   ANIMATION RESTART
====================================== */

function restartAnimation(
  element,
  className
){

  element
    .classList
    .remove(className);


  void element.offsetWidth;


  element
    .classList
    .add(className);

}


/* ======================================
   TEXT ANIMATION
====================================== */

function animateText(){

  restartAnimation(
    mainTitle,
    "play"
  );


  setTimeout(
    () => {

      restartAnimation(
        catchText,
        "play"
      );

    },
    110
  );


  setTimeout(
    () => {

      restartAnimation(
        redLine,
        "play"
      );

    },
    240
  );

}


/* ======================================
   PRELOAD NEXT
====================================== */

function preloadNext(){

  const next =
    getNextMovie();


  standbyVideo.src =
    next;


  standbyVideo.load();

}


/* ======================================
   CUT
====================================== */

function switchMovie(){

  if(switching){
    return;
  }


  switching = true;


  /*
    黒フェード開始
  */

  restartAnimation(
    cutBlack,
    "play"
  );


  /*
    0.46秒のちょうど中央付近で
    動画を交換

    230ms固定
  */

  setTimeout(

    () => {


      standbyVideo.currentTime =
        0;


      standbyVideo
        .play()
        .catch(() => {});


      activeVideo
        .classList
        .remove("active");


      standbyVideo
        .classList
        .add("active");


      activeVideo.pause();


      /*
        動画が変わるたびに
        下の文字も再アニメーション
      */

      animateText();


      const oldVideo =
        activeVideo;


      activeVideo =
        standbyVideo;


      standbyVideo =
        oldVideo;


      /*
        次の動画をすぐ裏で先読み
      */

      preloadNext();


    },

    230

  );


  /*
    暗転終了後
  */

  setTimeout(

    () => {

      switching =
        false;

    },

    520

  );

}


/* ======================================
   VIDEO END
====================================== */

movieA.addEventListener(
  "ended",
  switchMovie
);


movieB.addEventListener(
  "ended",
  switchMovie
);


/* ======================================
   ERROR
====================================== */

movieA.addEventListener(

  "error",

  () => {

    if(
      activeVideo === movieA
    ){

      switchMovie();

    }

  }

);


movieB.addEventListener(

  "error",

  () => {

    if(
      activeVideo === movieB
    ){

      switchMovie();

    }

  }

);


/* ======================================
   START
====================================== */

function start(){

  shuffleMovies();


  /*
    最初の動画
  */

  activeVideo.src =
    getNextMovie();


  activeVideo.load();


  /*
    次の動画は最初から裏で準備
  */

  preloadNext();


  /*
    最初の文字演出
  */

  animateText();


  /*
    最初の動画を再生
  */

  const startPlay = () => {

    activeVideo
      .play()
      .catch(() => {});

  };


  if(
    activeVideo.readyState >= 2
  ){

    startPlay();

  }

  else{

    activeVideo.addEventListener(

      "loadeddata",

      startPlay,

      {
        once:true
      }

    );

  }

}


start();


</script>


</body>
</html>
