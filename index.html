<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NANYO FOOTBALL CLUB</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

.header{
  width:100%;
  height:82px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 18px;

  background:
    linear-gradient(
      180deg,
      #d00023 0%,
      #b6001d 55%,
      #980018 100%
    );

  position:relative;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-logo{
  width:56px;
  height:56px;
  object-fit:contain;
  display:block;
}

.brand-name{
  color:#fff;
  font-size:31px;
  line-height:1;
  font-weight:900;
  letter-spacing:.055em;
  white-space:nowrap;
}

.menu{
  width:48px;
  height:48px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:7px;
}

.menu span{
  width:30px;
  height:3px;
  display:block;
  border-radius:3px;
  background:#d7b24a;
}


/* =========================
   MOVIE
========================= */

.movie-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16 / 9;
  overflow:hidden;
  background:#000;
}

.movie{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:contain;
  object-position:center;

  display:block;
  background:#000;

  opacity:0;
  z-index:1;
}

.movie.active{
  opacity:1;
}


/* =========================
   SVG EFFECT
========================= */

.mark-layer{
  position:absolute;
  inset:0;

  z-index:5;

  pointer-events:none;
  overflow:hidden;
}

.mark-svg{
  width:100%;
  height:100%;
  display:block;
}

/*
  動画を邪魔しないように
  かなり薄い赤
*/

#markOutline{
  fill:none;

  stroke:#e0002c;
  stroke-opacity:.12;

  stroke-width:3;

  stroke-linecap:round;
  stroke-linejoin:round;

  vector-effect:non-scaling-stroke;

  stroke-dasharray:1;
  stroke-dashoffset:1;
}


/* =========================
   BLACK CUT
========================= */

.cut-black{
  position:absolute;
  inset:0;

  background:#000;
  opacity:0;

  z-index:10;

  pointer-events:none;
}


/* =========================
   COPY
========================= */

.hero-copy{
  width:100%;
  overflow:hidden;

  padding:
    31px
    0
    46px
    22px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(140,0,15,.18),
      transparent 43%
    ),
    #000;
}


/* =========================
   TITLE
========================= */

.main-title{
  padding-right:20px;

  color:#fff;

  font-size:
    clamp(
      39px,
      10.5vw,
      70px
    );

  line-height:.90;

  font-weight:900;

  letter-spacing:-.055em;

  will-change:
    opacity,
    transform,
    filter;
}


/* =========================
   CATCH
========================= */

.catch{
  margin-top:22px;
  padding-right:12px;

  color:#ef161d;

  font-size:
    clamp(
      18px,
      5vw,
      32px
    );

  line-height:1;

  font-weight:900;
  font-style:italic;

  white-space:nowrap;

  will-change:
    opacity,
    transform;
}


/* =========================
   RED LINE
========================= */

.red-line{
  width:calc(100vw - 22px);
  height:4px;

  margin-top:20px;

  transform-origin:left center;

  background:
    linear-gradient(
      90deg,
      #ed001d 0%,
      #ff1931 65%,
      transparent 100%
    );
}


/* =========================
   PC
========================= */

@media(min-width:768px){

  .header{
    height:98px;
    padding:0 42px;
  }

  .brand-logo{
    width:70px;
    height:70px;
  }

  .brand-name{
    font-size:40px;
  }

  .menu span{
    width:36px;
    height:4px;
  }

  .hero-copy{
    padding:
      48px
      0
      65px
      6vw;
  }

}

<section class="hero-copy">

  <h1
    id="mainTitle"
    class="main-title">

    NANYO<br>
    FOOTBALL CLUB

  </h1>


  <div
    id="catchText"
    class="catch">

    COUNTERATTACK BEGINS

  </div>


  <div
    id="redLine"
    class="red-line">
  </div>

</section>



<script>


/* =========================
   MOVIES
========================= */

const movies = [

  "movie/nf1.mp4",
  "movie/nf2.mp4",
  "movie/nf3.mp4",
  "movie/nf4.mp4",
  "movie/nf5.mp4",
  "movie/nf6.mp4"

];


const movieA =
  document.getElementById("movieA");

const movieB =
  document.getElementById("movieB");

const cutBlack =
  document.getElementById("cutBlack");

const mainTitle =
  document.getElementById("mainTitle");

const catchText =
  document.getElementById("catchText");

const redLine =
  document.getElementById("redLine");

const markOutline =
  document.getElementById("markOutline");


let activeVideo = movieA;
let standbyVideo = movieB;

let playlist = [];

let lastMovie = null;

let switching = false;
let waiting = false;


/* =========================
   SHUFFLE
========================= */

function shuffleMovies(){

  playlist = [...movies];


  for(
    let i = playlist.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      playlist[i],
      playlist[j]

    ] = [

      playlist[j],
      playlist[i]

    ];

  }


  if(
    lastMovie &&
    playlist.length > 1 &&
    playlist[0] === lastMovie
  ){

    [
      playlist[0],
      playlist[1]

    ] = [

      playlist[1],
      playlist[0]

    ];

  }

}


function getNextMovie(){

  if(playlist.length === 0){
    shuffleMovies();
  }


  const next =
    playlist.shift();


  lastMovie =
    next;


  return next;

}


/* =========================
   TEXT EFFECT
========================= */

function animateText(){

  mainTitle
    .getAnimations()
    .forEach(a => a.cancel());

  catchText
    .getAnimations()
    .forEach(a => a.cancel());

  redLine
    .getAnimations()
    .forEach(a => a.cancel());


  mainTitle.animate(

    [
      {
        opacity:0,
        transform:"translateX(-38px)",
        filter:"blur(4px)"
      },

      {
        opacity:1,
        transform:"translateX(0)",
        filter:"blur(0)"
      }
    ],

    {
      duration:700,
      easing:"cubic-bezier(.12,.8,.2,1)",
      fill:"both"
    }

  );


  catchText.animate(

    [
      {
        opacity:0,
        transform:"translateX(26px)"
      },

      {
        opacity:1,
        transform:"translateX(0)"
      }
    ],

    {
      duration:600,
      delay:140,
      easing:"cubic-bezier(.12,.8,.2,1)",
      fill:"both"
    }

  );


  redLine.animate(

    [
      {
        opacity:0,
        transform:"scaleX(0)"
      },

      {
        opacity:1,
        transform:"scaleX(1)"
      }
    ],

    {
      duration:780,
      delay:260,
      easing:"cubic-bezier(.1,.8,.18,1)",
      fill:"both"
    }

  );

}


/* =========================
   SVG EFFECT
========================= */

function animateMark(){

  markOutline
    .getAnimations()
    .forEach(a => a.cancel());


  markOutline.style.strokeDashoffset =
    "1";


  markOutline.animate(

    [
      {
        strokeDashoffset:"1",
        opacity:.25
      },

      {
        strokeDashoffset:"0",
        opacity:1
      }
    ],

    {
      duration:8000,
      easing:"linear",
      fill:"forwards"
    }

  );

}


/* =========================
   PRELOAD NEXT
========================= */

function preloadNext(){

  standbyVideo.src =
    getNextMovie();


  standbyVideo.load();

}


/* =========================
   BLACK TRANSITION
========================= */

function blackTransition(){

  cutBlack
    .getAnimations()
    .forEach(a => a.cancel());


  cutBlack.animate(

    [
      {
        opacity:0
      },

      {
        opacity:1,
        offset:.40
      },

      {
        opacity:1,
        offset:.60
      },

      {
        opacity:0
      }
    ],

    {
      duration:420,
      easing:"linear"
    }

  );

}


/* =========================
   SWITCH
========================= */

function switchMovie(){

  if(switching){
    return;
  }


  /*
    次の動画がまだ準備できていない時は
    黒くせず最後の画面で待つ
  */

  if(standbyVideo.readyState < 2){

    if(waiting){
      return;
    }


    waiting = true;


    standbyVideo.addEventListener(

      "loadeddata",

      () => {

        waiting = false;

        switchMovie();

      },

      {
        once:true
      }

    );


    return;
  }


  switching = true;


  blackTransition();


  /*
    暗転中央で切替
  */

  setTimeout(

    () => {


      standbyVideo.currentTime = 0;


      standbyVideo
        .play()
        .catch(() => {});


      activeVideo
        .classList
        .remove("active");


      standbyVideo
        .classList
        .add("active");


      activeVideo.pause();


      /*
        動画切替ごとに
        文字エフェクト
      */

      animateText();


      /*
        動画切替ごとに
        SVGを0から8秒で描く
      */

      animateMark();


      const oldVideo =
        activeVideo;


      activeVideo =
        standbyVideo;


      standbyVideo =
        oldVideo;


      preloadNext();


    },

    210

  );


  setTimeout(

    () => {

      switching = false;

    },

    460

  );

}


/* =========================
   ENDED
========================= */

movieA.addEventListener(
  "ended",
  switchMovie
);


movieB.addEventListener(
  "ended",
  switchMovie
);


/* =========================
   START
========================= */

function start(){

  shuffleMovies();


  activeVideo.src =
    getNextMovie();


  activeVideo.load();


  /*
    次の動画を裏で先読み
  */

  preloadNext();


  const begin = () => {


    activeVideo
      .play()
      .catch(() => {});


    /*
      初回文字
    */

    animateText();


    /*
      初回SVG
    */

    animateMark();

  };


  if(
    activeVideo.readyState >= 2
  ){

    begin();

  }

  else{

    activeVideo.addEventListener(

      "loadeddata",

      begin,

      {
        once:true
      }

    );

  }

}


start();


</script>

</body>
</html>
