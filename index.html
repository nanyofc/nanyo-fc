<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NANYO FOOTBALL CLUB</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #000;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;

      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .hero-video.active {
      opacity: 1;
    }

    /* 動画を少し暗くして文字を見やすくする */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.25) 0%,
          rgba(0,0,0,0.08) 40%,
          rgba(0,0,0,0.55) 100%
        );
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 22px 24px;
    }

    .header-name {
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.22em;
    }

    .menu {
      width: 42px;
      height: 42px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: 6px;
    }

    .menu span {
      width: 25px;
      height: 2px;
      background: #fff;
      display: block;
    }

    .hero-content {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 70px;

      z-index: 4;
    }

    .club-name {
      color: #fff;
      font-size: clamp(34px, 9vw, 76px);
      line-height: 0.93;
      font-weight: 900;
      letter-spacing: -0.045em;

      opacity: 0;
      transform: translateY(24px);

      animation: titleIn 1s ease forwards;
      animation-delay: 0.35s;
    }

    .catch {
      margin-top: 15px;

      color: #e10600;
      font-size: clamp(17px, 4.8vw, 34px);
      line-height: 1;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.055em;

      opacity: 0;
      transform: translateX(-20px);

      animation: catchIn 0.8s ease forwards;
      animation-delay: 0.9s;
    }

    .red-line {
      width: 0;
      height: 2px;

      margin-top: 16px;

      background: #e10600;

      animation: lineIn 1.1s ease forwards;
      animation-delay: 1.2s;
    }

    .scroll {
      position: absolute;
      bottom: 18px;
      left: 50%;

      transform: translateX(-50%);
      z-index: 5;

      color: rgba(255,255,255,0.75);

      font-size: 9px;
      letter-spacing: 0.28em;
      text-align: center;
    }

    .scroll::after {
      content: "";
      display: block;

      width: 1px;
      height: 22px;

      margin: 8px auto 0;

      background: rgba(255,255,255,0.7);

      animation: scrollMove 1.6s ease-in-out infinite;
    }

    @keyframes titleIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes catchIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes lineIn {
      to {
        width: 90px;
      }
    }

    @keyframes scrollMove {
      0%, 100% {
        transform: scaleY(0.4);
        transform-origin: top;
        opacity: 0.3;
      }

      50% {
        transform: scaleY(1);
        transform-origin: top;
        opacity: 1;
      }
    }

    @media (min-width: 768px) {
      .header {
        padding: 30px 45px;
      }

      .header-name {
        font-size: 17px;
      }

      .hero-content {
        left: 6vw;
        bottom: 10vh;
      }

      .club-name {
        max-width: 900px;
      }

      .red-line {
        height: 3px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <video
      id="videoA"
      class="hero-video active"
      muted
      playsinline
      preload="auto">
    </video>

    <video
      id="videoB"
      class="hero-video"
      muted
      playsinline
      preload="metadata">
    </video>

    <header class="header">
      <div class="header-name">
        NANYO FC
      </div>

      <div class="menu">
        <span></span>
        <span></span>
      </div>
    </header>

    <div class="hero-content">

      <h1 class="club-name">
        NANYO<br>
        FOOTBALL CLUB
      </h1>

      <div class="catch">
        COUNTERATTACK BEGINS
      </div>

      <div class="red-line"></div>

    </div>

    <div class="scroll">
      SCROLL
    </div>

  </section>


  <script>

    const movies = [
      "movie/nf1.mp4",
      "movie/nf2.mp4",
      "movie/nf3.mp4",
      "movie/nf4.mp4",
      "movie/nf5.mp4",
      "movie/nf6.mp4"
    ];

    const videoA = document.getElementById("videoA");
    const videoB = document.getElementById("videoB");

    let activeVideo = videoA;
    let standbyVideo = videoB;

    let playlist = [];

    function shuffleMovies() {

      playlist = [...movies];

      for (let i = playlist.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [playlist[i], playlist[j]] =
        [playlist[j], playlist[i]];
      }
    }


    function getNextMovie() {

      if (playlist.length === 0) {
        shuffleMovies();
      }

      return playlist.shift();
    }


    function startFirstVideo() {

      shuffleMovies();

      activeVideo.src = getNextMovie();

      activeVideo.load();

      activeVideo.play().catch(() => {});

      prepareNextVideo();
    }


    function prepareNextVideo() {

      standbyVideo.src = getNextMovie();

      standbyVideo.load();
    }


    function switchVideo() {

      standbyVideo.currentTime = 0;

      standbyVideo.play()
      .then(() => {

        standbyVideo.classList.add("active");
        activeVideo.classList.remove("active");

        setTimeout(() => {

          activeVideo.pause();

          const oldVideo = activeVideo;

          activeVideo = standbyVideo;
          standbyVideo = oldVideo;

          prepareNextVideo();

        }, 800);

      })
      .catch(() => {});
    }


    videoA.addEventListener("ended", switchVideo);
    videoB.addEventListener("ended", switchVideo);


    startFirstVideo();

  </script>

</body>
</html>
