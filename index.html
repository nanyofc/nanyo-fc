<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NANYO FOOTBALL CLUB</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      height: 80px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      background: #a90016;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
      display: block;
    }

    .brand-name {
      color: #d9b45d;

      font-size: 20px;
      font-weight: 900;

      letter-spacing: 0.14em;
      white-space: nowrap;
    }


    /* ハンバーガー */

    .menu {
      width: 46px;
      height: 46px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 7px;
    }

    .menu span {
      width: 29px;
      height: 3px;

      display: block;

      background: #d9b45d;
    }


    /* =========================
       MOVIE
    ========================= */

    .movie-wrap {
      position: relative;

      width: 100%;
      aspect-ratio: 16 / 9;

      overflow: hidden;
      background: #000;
    }

    .movie {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center;

      background: #000;

      opacity: 0;

      transition:
        opacity 0.5s ease,
        transform 8s linear;

      transform: scale(1);
    }

    .movie.active {
      opacity: 1;
      transform: scale(1.025);
    }


    /* 映像を少し締める */

    .movie-shade {
      position: absolute;
      inset: 0;

      z-index: 4;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.08),
          rgba(0,0,0,0) 55%,
          rgba(0,0,0,0.15)
        );
    }


    /* 切替フラッシュ */

    .flash {
      position: absolute;
      inset: 0;

      z-index: 5;

      background: #fff;

      opacity: 0;
      pointer-events: none;
    }

    .flash.fire {
      animation: flashEffect 0.24s ease;
    }

    @keyframes flashEffect {
      0% {
        opacity: 0;
      }

      35% {
        opacity: 0.65;
      }

      100% {
        opacity: 0;
      }
    }


    /* =========================
       VIDEO下の文字
    ========================= */

    .hero-copy {
      width: 100%;

      padding: 32px 22px 48px;

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(130,0,0,0.18),
          transparent 45%
        ),
        #000;
    }


    .main-title {
      color: #fff;

      font-size: clamp(39px, 10.5vw, 70px);
      font-weight: 900;

      line-height: 0.9;
      letter-spacing: -0.05em;

      opacity: 0;
      transform: translateY(20px);

      animation: titleIn 0.8s ease forwards;
      animation-delay: 0.2s;
    }


    .catch {
      margin-top: 22px;

      color: #ed1717;

      font-size: clamp(18px, 5vw, 32px);
      font-weight: 900;
      font-style: italic;

      line-height: 1;
      letter-spacing: 0.02em;

      white-space: nowrap;

      opacity: 0;
      transform: translateX(-18px);

      animation: catchIn 0.7s ease forwards;
      animation-delay: 0.7s;
    }


    .red-line {
      width: 0;
      height: 3px;

      margin-top: 20px;

      background: #ed1717;

      animation: lineIn 0.9s ease forwards;
      animation-delay: 1s;
    }


    @keyframes titleIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes catchIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes lineIn {
      to {
        width: 150px;
      }
    }


    /* =========================
       PC
    ========================= */

    @media (min-width: 768px) {

      .header {
        height: 95px;
        padding: 0 45px;
      }

      .brand-logo {
        width: 68px;
        height: 68px;
      }

      .brand-name {
        font-size: 25px;
      }

      .hero-copy {
        padding: 45px 6vw 65px;
      }

      .main-title {
        font-size: clamp(65px, 7vw, 105px);
      }

      .catch {
        font-size: clamp(27px, 3vw, 48px);
      }
    }

  </style>
</head>


<body>


  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <img
        src="nf1.png"
        alt="NANYO FC"
        class="brand-logo"
      >

      <div class="brand-name">
        NANYO FC
      </div>

    </div>


    <div class="menu">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </header>



  <!-- MOVIE -->

  <section class="movie-wrap">

    <video
      id="movieA"
      class="movie active"
      muted
      playsinline
      preload="auto">
    </video>

    <video
      id="movieB"
      class="movie"
      muted
      playsinline
      preload="metadata">
    </video>

    <div class="movie-shade"></div>

    <div
      id="flash"
      class="flash">
    </div>

  </section>



  <!-- VIDEO直下の文字 -->

  <section class="hero-copy">

    <h1 class="main-title">
      NANYO<br>
      FOOTBALL CLUB
    </h1>

    <div class="catch">
      COUNTERATTACK BEGINS
    </div>

    <div class="red-line"></div>

  </section>



  <script>

    const movies = [
      "movie/nf1.mp4",
      "movie/nf2.mp4",
      "movie/nf3.mp4",
      "movie/nf4.mp4",
      "movie/nf5.mp4",
      "movie/nf6.mp4"
    ];


    const movieA =
      document.getElementById("movieA");

    const movieB =
      document.getElementById("movieB");

    const flash =
      document.getElementById("flash");


    let activeMovie = movieA;
    let standbyMovie = movieB;

    let playlist = [];
    let lastMovie = null;
    let switching = false;


    function shuffleMovies() {

      playlist = [...movies];

      for (
        let i = playlist.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(Math.random() * (i + 1));

        [
          playlist[i],
          playlist[j]
        ] = [
          playlist[j],
          playlist[i]
        ];
      }


      if (
        lastMovie &&
        playlist.length > 1 &&
        playlist[0] === lastMovie
      ) {

        [
          playlist[0],
          playlist[1]
        ] = [
          playlist[1],
          playlist[0]
        ];
      }
    }


    function getNextMovie() {

      if (playlist.length === 0) {
        shuffleMovies();
      }

      const next = playlist.shift();

      lastMovie = next;

      return next;
    }


    function prepareNextMovie() {

      standbyMovie.src = getNextMovie();

      standbyMovie.load();
    }


    function fireFlash() {

      flash.classList.remove("fire");

      void flash.offsetWidth;

      flash.classList.add("fire");
    }


    function switchMovie() {

      if (switching) return;

      switching = true;

      fireFlash();


      setTimeout(() => {

        standbyMovie.currentTime = 0;

        standbyMovie.play()

          .then(() => {

            standbyMovie.classList.add("active");

            activeMovie.classList.remove("active");


            setTimeout(() => {

              activeMovie.pause();

              const oldMovie = activeMovie;

              activeMovie = standbyMovie;

              standbyMovie = oldMovie;

              prepareNextMovie();

              switching = false;

            }, 550);

          })

          .catch(() => {

            switching = false;

          });

      }, 90);
    }


    function startMovies() {

      shuffleMovies();

      activeMovie.src = getNextMovie();

      activeMovie.load();

      activeMovie.play().catch(() => {});

      prepareNextMovie();
    }


    movieA.addEventListener(
      "ended",
      switchMovie
    );

    movieB.addEventListener(
      "ended",
      switchMovie
    );


    startMovies();

  </script>


</body>
</html>
